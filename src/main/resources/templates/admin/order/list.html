<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin list</title>
    <!--
        날짜 : 2025/09/28
        이름 : 이수연
        내용 : 관리자 주문현황 페이지
    -->
    <link rel="stylesheet" th:href="@{/css/admin/order/commonOrder.css}">
</head>
<body>
<div th:replace="~{admin/common/header :: header}"></div>
<main>
    <section class="content-wrap">
        <div th:replace="~{admin/common/aside :: aside}"></div>
        <section id="main-section">
            <div class="top-nav">
                <h3>주문현황</h3>
                <ul class="page-nation">
                    <li><a th:href="@{/admin/}">Home</a></li>
                    <li><a href="#">주문관리</a></li>
                    <li><a th:href="@{/admin/order/list}">주문현황</a></li>
                </ul>
            </div>
            <form th:action="@{/admin/order/list}" method="get" class="search-form">
                <select>
                    <option name="searchType" value="orderNo">주문번호</option>
                    <option name="searchType" value="memId">주문자</option>
                    <option name="searchType" value="name">주문자명</option>
                </select>
                <input type="text" name="keyword" placeholder="세부 검색을 해보세요"/>
                <button type="submit">
                    <img th:src="@{/images/magnifier.png}" alt="돋보기" />
                </button>
            </form>
            <table class="order-table">
                <tr>
                    <th>주문번호</th>
                    <th>주문자ID</th>
                    <th>주문자명</th>
                    <th>주문건수</th>
                    <th>주문합계</th>
                    <th style="width: 45px;">결제수단</th>
                    <th style="width: 45px;">주문상태</th>
                    <th>주문일</th>
                    <th>배송</th>
                </tr>
                <tr th:each="order, stat : ${orderList}">
                    <td><span class="order-number-link" th:attr="data-orderno=${order.orderNo}" onclick="openModal('modalOrderDetail', this.dataset.orderno) ">[[${order.orderNo}]]</span></td>
                    <td>[[${order.memId}]]</td>
                    <td>[[${order.name}]]</td>
                    <td>[[${order.quantity}]]</td>
                    <td>[[${order.totalPrice}]]</td>
                    <td>[[${order.payMethod}]]</td>
                    <td>[[${order.status}]]</td>
                    <td>[[${order.orderedAt}]]</td>
                    <td class="del-btn" th:switch="${order.deliveryStatus}">
                        <input type="button" value="배송하기"
                               th:if="${order.deliveryStatus == '배송 대기'}"
                               th:attr="data-orderno=${order.orderNo}"
                               onclick="openModal('modalDeliveryInput', this.dataset.orderno)">
                        <span th:case="'배송 중'">배송 중</span>
                        <span th:case="'배송 완료'">배송 완료</span>
                    </td>
                </tr>
            </table>
            <!-- 페이징 -->
            <div class="pagination"
                 th:with="
                    page=${orderList},
                    now=${page.number},
                    total=${page.totalPages},
                    size=${page.size},
                    block=${5},
                    start=${(now / block) * block},
                    end=${ ((total - 1) < (start + block - 1)) ? (total - 1) : (start + block - 1) },
                    prev=${ (now > 0) ? (now - 1) : 0 },
                    next=${ ((now + 1) < total) ? (now + 1) : (total - 1) },
                    st=${param.searchType != null ? param.searchType[0] : ''},
                    kw=${param.keyword    != null ? param.keyword[0]    : ''}
                 ">
                <div th:if="${total > 0}">
                    <a th:href="@{|?page=0&size=${size}&searchType=${st}&keyword=${kw}|}"
                       th:classappend="${page.first} ? ' disabled'">« 처음</a>

                    <a th:href="@{|?page=${prev}&size=${size}&searchType=${st}&keyword=${kw}|}"
                       th:classappend="${page.first} ? ' disabled'">‹ 이전</a>

                    <th:block th:each="i : ${#numbers.sequence(start, end)}">
                        <a th:href="@{|?page=${i}&size=${size}&searchType=${st}&keyword=${kw}|}"
                           th:classappend="${i == now} ? ' active'">[[${i + 1}]]</a>
                    </th:block>

                    <a th:href="@{|?page=${next}&size=${size}&searchType=${st}&keyword=${kw}|}"
                       th:classappend="${page.last} ? ' disabled'">다음 ›</a>

                    <a th:href="@{|?page=${total - 1}&size=${size}&searchType=${st}&keyword=${kw}|}"
                       th:classappend="${page.last} ? ' disabled'">마지막 »</a>
                </div>
            </div>
        </section>
    </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<div th:replace="~{admin/order/_orderDetail :: modal-order-detail}"></div>
<div th:replace="~{admin/order/_deliveryInput :: modal-delivery-input}"></div>
<script th:inline="javascript">
    window.BASE_URL = /*[[@{/}]]*/ "/greengarden/";  // 반드시 "/"로 fallback
</script>
<script th:src="@{/js/admin/order/order.js}"></script>
<script th:src="@{/js/admin/aside.js}"></script>
</body>
</html>
