<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>admin CS FAQ list</title>
    <link rel="stylesheet" th:href="@{/css/admin/common/header.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/cs/admincsmain.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/common/footer.css}" />
</head>
<body>
<div th:replace="~{/admin/common/header :: header}"></div>
<main>
    <section class="content-wrap">
        <div th:replace="~{/admin/cs/aside :: aside}"></div>

        <section id="main-section">
            <div class="top_nav">
                <h5>FAQ 목록</h5>
            </div>

            <div class="search-form">
                <select id="category1Select" onchange="updateCategory2Options()">
                    <option value="">1차 카테고리 선택</option>
                    <option value="회원">회원</option>
                    <option value="쿠폰/이벤트">쿠폰/이벤트</option>
                    <option value="주문/결재">주문/결재</option>
                    <option value="배송">배송</option>
                    <option value="취소/반품/교환">취소/반품/교환</option>
                    <option value="여행/숙박/항공">여행/숙박/항공</option>
                    <option value="안전거래">안전거래</option>
                </select>

                <select id="category2Select" onchange="filterFaqList()">
                    <option value="">2차 카테고리 선택</option>
                </select>
            </div>

            <table class="admincsnotice-table">
                <thead>
                <tr>
                    <th style="width: 30px;">
                        <input type="checkbox" id="selectAll" onclick="toggleAllCheckboxes(this)" />
                    </th>
                    <th>번호</th>
                    <th>1차 카테고리</th>
                    <th>2차 카테고리</th>
                    <th>제목</th>
                    <th>조회</th>
                    <th>날짜</th>
                    <th style="width: 80px;">관리</th>
                </tr>
                </thead>
                <tbody id="faqTableBody">
                <tr id="selectCategoryMessage">
                    <td colspan="8" style="text-align: center">카테고리를 선택해 주세요.</td>
                </tr>

                <tr id="noDataMessage" style="display: none;">
                    <td colspan="8" style="text-align: center">등록된 FAQ가 없습니다.</td>
                </tr>

                <th:block th:each="entry : ${faqMap}">
                    <tr class="category-header"
                        th:attr="data-category1=${entry.value[0].category1}, data-category2=${entry.key}"
                        style="display: none;">
                        <td colspan="8" style="background-color: #f1f1f1; font-weight: bold; padding: 10px;"
                            th:text="${entry.key}">2차 카테고리</td>
                    </tr>

                    <tr th:each="faq, iterStat : ${entry.value}"
                        class="faq-row"
                        th:attr="data-category1=${faq.category1}, data-category2=${faq.category2}, data-index=${iterStat.index}"
                        style="display: none;">
                        <td><input type="checkbox" name="admincscheck" th:value="${faq.faqId}" /></td>
                        <td th:text="${faq.faqId}">1</td>
                        <td th:text="${faq.category1}">회원</td>
                        <td th:text="${faq.category2}">가입</td>
                        <td>
                            <a th:href="@{/admin/cs/faq/view(faqId=${faq.faqId})}"
                               th:text="${faq.title}"></a>
                        </td>
                        <td th:text="${faq.views}">0</td>
                        <td th:text="${#temporals.format(faq.getCreatedAt(), 'yyyy.MM.dd')}">23.10.31</td>                        <td>
                            <button type="button"
                                    th:onclick="|location.href='@{/admin/cs/faq/modify(faqId=${faq.faqId})}'|"
                                    class="btn-modify">수정</button>
                            <button type="button" class="btn-delete"
                                    th:onclick="deleteFaq('${faq.faqId}')">삭제</button>
                        </td>
                    </tr>
                </th:block>
                </tbody>
            </table>

            <div class="action-buttons">
                <button type="button" onclick="deleteSelected()" class="btn-delete-all">선택삭제</button>
                <button type="button" class="btn-write"
                        th:onclick="|location.href='@{/admin/cs/faq/write}'|">작성하기</button>
            </div>
        </section>
    </section>
</main>
<div th:replace="~{/admin/common/footer :: footer}"></div>

<script>
    // 1차 카테고리에 따른 2차 카테고리 옵션
    const category2Options = {
        '회원': ['가입', '탈퇴', '회원정보'],
        '쿠폰/이벤트': ['쿠폰', '이벤트/할인'],
        '주문/결재': ['주문', '결재'],
        '배송': ['배송 일반', '택배/수령'],
        '취소/반품/교환': ['취소/변경', '반품/교환'],
        '여행/숙박/항공': ['예약/구매', '취소/변경'],
        '안전거래': ['이용규정', '피해예방'],
    };

    // 1차 카테고리 변경 시 2차 카테고리 옵션 업데이트
    function updateCategory2Options() {
        const category1Select = document.getElementById('category1Select');
        const category2Select = document.getElementById('category2Select');
        const category1 = category1Select.value;

        // 2차 카테고리 초기화
        category2Select.innerHTML = '<option value="">2차 카테고리 선택</option>';

        if (category1) {
            const options = category2Options[category1] || [];
            options.forEach(option => {
                const optElement = document.createElement('option');
                optElement.value = option;
                optElement.textContent = option;
                category2Select.appendChild(optElement);
            });
        }

        // FAQ 목록 필터링
        filterFaqList();
    }

    // FAQ 목록 필터링
    function filterFaqList() {
        const category1 = document.getElementById('category1Select').value;
        const category2 = document.getElementById('category2Select').value;

        const selectMessage = document.getElementById('selectCategoryMessage');
        const noDataMessage = document.getElementById('noDataMessage');
        const categoryHeaders = document.querySelectorAll('.category-header');
        const faqRows = document.querySelectorAll('.faq-row');

        // 모든 행 숨기기
        categoryHeaders.forEach(header => header.style.display = 'none');
        faqRows.forEach(row => row.style.display = 'none');

        // 카테고리 선택 안 됨
        if (!category1 || !category2) {
            selectMessage.style.display = '';
            noDataMessage.style.display = 'none';
            return;
        }

        selectMessage.style.display = 'none';

        // 해당 카테고리의 헤더와 데이터 찾기
        let hasData = false;
        let displayCount = 0;

        // 카테고리 헤더 표시
        categoryHeaders.forEach(header => {
            if (header.dataset.category1 === category1 && header.dataset.category2 === category2) {
                header.style.display = '';
            }
        });

        // FAQ 행 표시 (최대 10개)
        faqRows.forEach(row => {
            if (row.dataset.category1 === category1 && row.dataset.category2 === category2) {
                if (displayCount < 10) {
                    row.style.display = '';
                    hasData = true;
                    displayCount++;
                }
            }
        });

        // 데이터 없음 메시지
        if (!hasData) {
            noDataMessage.style.display = '';
        } else {
            noDataMessage.style.display = 'none';
        }
    }

    function toggleAllCheckboxes(source) {
        const checkboxes = document.querySelectorAll('input[name="admincscheck"]');
        checkboxes.forEach(cb => {
            // 보이는 행의 체크박스만 선택
            if (cb.closest('tr').style.display !== 'none') {
                cb.checked = source.checked;
            }
        });
    }

    function deleteSelected() {
        const checkboxes = document.querySelectorAll('input[name="admincscheck"]:checked');
        const checkedBoxes = Array.from(checkboxes).filter(cb =>
            cb.closest('tr').style.display !== 'none'
        );

        if (checkedBoxes.length === 0) {
            alert('삭제할 항목을 선택해 주세요.');
            return;
        }

        if (confirm(`${checkedBoxes.length}개 항목을 삭제하시겠습니까?`)) {
            const faqIds = checkedBoxes.map(cb => cb.value);

            fetch('/admin/cs/faq/deleteMultiple', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ faqIds: faqIds })
            })
                .then(response => {
                    if(response.ok) {
                        alert('삭제가 완료되었습니다.');
                        location.reload();
                    } else {
                        alert('삭제 중 오류가 발생했습니다.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('삭제 중 오류가 발생했습니다.');
                });
        }
    }

    function deleteFaq(faqId) {
        if(confirm(`FAQ ${faqId}를 삭제하시겠습니까?`)) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/admin/cs/faq/delete';

            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'faqId';
            input.value = faqId;

            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        }
    }

    // 페이지 로드 시 초기화
    document.addEventListener('DOMContentLoaded', function() {
        filterFaqList();
    });
</script>
</body>
</html>
