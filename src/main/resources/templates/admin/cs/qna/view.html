<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>admin CS QNA View</title>
    <link rel="stylesheet" th:href="@{/css/admin/common/header.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/cs/admincsmain.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/common/footer.css}" />

</head>
<body>
<div th:replace="~{admin/common/header.html}"></div>
<main>
    <section class="content-wrap">
        <div th:replace="~{/admin/cs/aside :: aside}"></div>

        <section id="main-section">
            <div class="top_nav">
                <h5>1:1 문의 보기</h5>
                <ul class="page_nation">
                    <li><a href="#">HOME</a></li>
                    <li><a href="#">고객센터</a></li>
                    <li><a th:href="@{/admin/cs/qna/list}">1:1 문의</a></li>
                </ul>
            </div>

            <div class="admincs-view-container">

                <div class="admincs-view-row admincs-view-type">
                    <span class="admincs-view-label-text">유형</span>
                    <span class="admincs-view-content" th:text="|${inquiryDTO.category1} - ${inquiryDTO.category2}|">회원 - 가입</span>
                </div>

                <div class="admincs-view-row admincs-view-title">
                    <span class="admincs-view-label-text">제목</span>
                    <span class="admincs-view-content" th:text="${inquiryDTO.title}">[ 안내 ] 문의 제목입니다.</span>
                </div>

                <div class="admincs-view-content-area">
                    <span class="admincs-view-label-text">내용</span>
                    <div class="admincs-view-content-text">
                        <p th:utext="${inquiryDTO.content}">문의 내용입니다. 줄바꿈 처리됨.</p>
                    </div>
                </div>

                <div class="admincs-view-content-area">
                    <span class="admincs-view-label-text">답변</span>
                    <div class="admincs-view-content-text">
                        <p th:utext="${inquiryDTO.answer != null and inquiryDTO.answer != '' ? inquiryDTO.answer : '답변이 아직 등록되지 않았습니다.'}"></p>
                    </div>
                </div>
                <div class="admincs-view-actions">

                    <form th:action="@{/admin/cs/qna/delete}" method="post" onsubmit="return confirm('해당 문의를 정말 삭제하시겠습니까?');">
                        <input type="hidden" name="inquiryId" th:value="${inquiryDTO.inquiryId}" />
                        <input type="hidden" name="pg" th:value="${PageRequestDTO.pg}" />
                        <button type="submit" class="btn-delete">삭제</button>
                    </form>


                    <button type="button"
                            th:onclick="|location.href='@{/admin/cs/qna/list}'|"
                            class="btn-list">
                        목록
                    </button>
                </div>

            </div>
        </section>
    </section>
</main>
<div th:replace="~{/admin/common/footer :: footer}"></div>
</body>
</html>
