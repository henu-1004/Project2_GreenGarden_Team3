<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>admin CS QNA list</title>
    <!-- 날짜 : 2025/10/20 이름 : 박효빈 내용 : 관리자 1:1 문의 목록 페이지 -->
    <link rel="stylesheet" th:href="@{/css/admin/common/header.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/cs/admincsmain.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/common/footer.css}" />
</head>

<body>
<!-- ✅ 헤더 -->
<div th:replace="~{admin/common/header :: header}"></div>

<main>
    <section class="content-wrap">
        <!-- ✅ 사이드바 -->
        <div th:replace="~{admin/common/aside :: aside}"></div>

        <section id="main-section">
            <div class="top_nav">
                <h5>1:1 문의 목록</h5>
                <ul class="page_nation">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">고객센터</a></li>
                    <li><a th:href="@{/admin/cs/qna/list}">1:1 문의</a></li>
                </ul>
            </div>

            <!-- ✅ 검색/필터 -->
            <form th:action="@{/admin/cs/qna/list}" method="get" class="search-form" id="qnaFilterForm">
                <input type="hidden" name="pg" th:value="${pageRequestDTO.pg}" />
                <input type="hidden" name="size" th:value="${pageRequestDTO.size}" />
                <input type="hidden" name="searchType" th:value="${pageRequestDTO.searchType}" />
                <input type="hidden" name="keyword" th:value="${pageRequestDTO.keyword}" />

                <select name="category1" id="category1Select" onchange="updateCategory2Options()">
                    <option value="" th:selected="${pageRequestDTO.category1 == null or pageRequestDTO.category1 == ''}">1차 유형 (전체)</option>
                    <option value="회원" th:selected="${pageRequestDTO.category1 == '회원'}">회원</option>
                    <option value="쿠폰/이벤트" th:selected="${pageRequestDTO.category1 == '쿠폰/이벤트'}">쿠폰/이벤트</option>
                    <option value="주문/결제" th:selected="${pageRequestDTO.category1 == '주문/결제'}">주문/결제</option>
                    <option value="배송" th:selected="${pageRequestDTO.category1 == '배송'}">배송</option>
                    <option value="취소/반품/교환" th:selected="${pageRequestDTO.category1 == '취소/반품/교환'}">취소/반품/교환</option>
                    <option value="여행/숙박/항공" th:selected="${pageRequestDTO.category1 == '여행/숙박/항공'}">여행/숙박/항공</option>
                    <option value="안전거래" th:selected="${pageRequestDTO.category1 == '안전거래'}">안전거래</option>
                    <option value="기타" th:selected="${pageRequestDTO.category1 == '기타'}">기타</option>
                </select>

                <select name="category2" id="category2Select" onchange="document.getElementById('qnaFilterForm').submit()" disabled>
                    <option value="" th:selected="${pageRequestDTO.category2 == null or pageRequestDTO.category2 == ''}">2차 유형 (전체)</option>
                </select>
            </form>

            <!-- ✅ QNA 목록 테이블 -->
            <table class="admincsnotice-table">
                <thead>
                <tr>
                    <th style="width: 30px;"><input type="checkbox" id="selectAll" onclick="toggleAllCheckboxes(this)" /></th>
                    <th>번호</th>
                    <th>1차 유형</th>
                    <th>2차 유형</th>
                    <th>제목</th>
                    <th>상태</th>
                    <th>작성자</th>
                    <th>날짜</th>
                    <th style="width: 80px;">관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(responseDTO.dtoList)}">
                    <td colspan="9" style="text-align: center">등록된 1:1 문의가 없습니다.</td>
                </tr>
                <tr th:each="inquiry : ${responseDTO.dtoList}">
                    <td><input type="checkbox" name="admincscheck" th:value="${inquiry.inquiryId}" /></td>
                    <td th:text="${inquiry.inquiryId}">1</td>
                    <td th:text="${inquiry.category1}"></td>
                    <td th:text="${inquiry.category2}"></td>
                    <td>
                        <a th:if="${inquiry.status == '대기'}"
                           th:href="@{/admin/cs/qna/reply(inquiryId=${inquiry.inquiryId})}"
                           th:text="${inquiry.title}">[답변대기]</a>
                        <a th:if="${inquiry.status == '완료'}"
                           th:href="@{/admin/cs/qna/view(inquiryId=${inquiry.inquiryId})}"
                           th:text="${inquiry.title}">[답변완료]</a>
                    </td>
                    <td>
                        <span class="qna-status"
                              th:classappend="${inquiry.status == '대기'} ? 'waiting' :
                                              (${inquiry.status == '완료'} ? 'completed' : '')"
                              th:text="${inquiry.status}">대기</span>
                    </td>
                    <td>
                        <th:block th:with="writerId=${inquiry.writer}">
                            <span th:if="${#strings.length(writerId) >= 3}">
                                <span th:text="${#strings.substring(writerId, 0, 3)}">hyo</span>***
                            </span>
                            <span th:unless="${#strings.length(writerId) >= 3}" th:text="${writerId}"></span>
                        </th:block>
                    </td>
                    <td th:text="${#temporals.format(inquiry.createdAt, 'yy.MM.dd')}"></td>
                    <td>
                        <button type="button"
                                th:onclick="|location.href='@{/admin/cs/qna/view(inquiryId=${inquiry.inquiryId})}'|"
                                class="btn-modify">보기/답변</button>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- ✅ 페이징 -->
            <div class="cs-pagination" th:if="${!responseDTO.dtoList.isEmpty()}">
                <a th:if="${responseDTO.prev}"
                   th:href="@{/admin/cs/qna/list(pg=${responseDTO.start - 1}, size=${pageRequestDTO.size}, category1=${pageRequestDTO.category1}, category2=${pageRequestDTO.category2})}"
                   class="prev">&lt; 이전</a>
                <span th:unless="${responseDTO.prev}" class="prev disabled">&lt; 이전</span>

                <th:block th:each="pageNum : ${#numbers.sequence(responseDTO.start, responseDTO.end)}">
                    <a th:href="@{/admin/cs/qna/list(pg=${pageNum}, size=${pageRequestDTO.size}, category1=${pageRequestDTO.category1}, category2=${pageRequestDTO.category2})}"
                       th:classappend="${pageNum == pageRequestDTO.pg ? 'active' : ''}"
                       th:text="${pageNum}">1</a>
                </th:block>

                <a th:if="${responseDTO.next}"
                   th:href="@{/admin/cs/qna/list(pg=${responseDTO.end + 1}, size=${pageRequestDTO.size}, category1=${pageRequestDTO.category1}, category2=${pageRequestDTO.category2})}"
                   class="next">다음 &gt;</a>
                <span th:unless="${responseDTO.next}" class="next disabled">다음 &gt;</span>
            </div>

            <!-- ✅ 하단 버튼 -->
            <div class="action-buttons">
                <button type="button" onclick="deleteSelected()" class="btn-delete-all">선택 삭제</button>
            </div>

            <!-- ✅ 숨겨진 폼 (선택삭제용) -->
            <form id="deleteForm" th:action="@{/admin/cs/qna/deleteMultiple}" method="post">
                <input type="hidden" id="qnaIdsInput" name="qnaIds">
            </form>
        </section>
    </section>
</main>

<!-- ✅ Footer -->
<div th:replace="~{admin/common/footer :: footer}"></div>

<!-- ✅ JS -->
<script th:inline="javascript">
    const category2Options = {
        "회원": ["가입", "탈퇴", "회원정보"],
        "쿠폰/이벤트": ["쿠폰", "이벤트", "적립금"],
        "주문/결제": ["주문", "결제", "영수증"],
        "배송": ["배송조회", "배송지연", "배송지변경"],
        "취소/반품/교환": ["주문취소", "반품", "교환"],
        "여행/숙박/항공": ["여행", "숙박", "항공"],
        "안전거래": ["안전거래", "사기신고", "분쟁조정"],
        "기타": ["기타문의"]
    };

    const category1Select = document.getElementById('category1Select');
    const category2Select = document.getElementById('category2Select');
    const currentCategory1 = /*[[${pageRequestDTO.category1}]]*/ '';
    const currentCategory2 = /*[[${pageRequestDTO.category2}]]*/ '';

    // ✅ 페이지 로드 시 즉시 실행
    (function initCategoryOptions() {
        if (currentCategory1 && category2Options[currentCategory1]) {
            const options = category2Options[currentCategory1];
            category2Select.innerHTML = '<option value="">2차 유형 (전체)</option>';
            options.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt;
                option.textContent = opt;
                if (opt === currentCategory2) option.selected = true;
                category2Select.appendChild(option);
            });
            category2Select.disabled = false;
        }
    })();

    // ✅ 1차 선택 시 2차 갱신
    function updateCategory2Options() {
        const category1 = category1Select.value;
        category2Select.innerHTML = '<option value="">2차 유형 (전체)</option>';
        category2Select.disabled = true;

        if (category1 && category2Options[category1]) {
            const options = category2Options[category1];
            options.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt;
                option.textContent = opt;
                category2Select.appendChild(option);
            });
            category2Select.disabled = false;
        }
        document.getElementById('qnaFilterForm').submit();
    }

    // ✅ 전체 선택
    function toggleAllCheckboxes(source) {
        const checkboxes = document.getElementsByName('admincscheck');
        checkboxes.forEach(cb => cb.checked = source.checked);
    }

    // ✅ 선택삭제
    function deleteSelected() {
        const checkedBoxes = [...document.getElementsByName('admincscheck')].filter(cb => cb.checked);
        if (checkedBoxes.length === 0) {
            alert('삭제할 항목을 선택해 주세요.');
            return;
        }
        if (confirm(`${checkedBoxes.length}개 항목을 삭제하시겠습니까?`)) {
            const ids = checkedBoxes.map(cb => cb.value);
            document.getElementById('qnaIdsInput').value = ids.join(',');
            document.getElementById('deleteForm').submit();
        }
    }
</script>

<script th:src="@{/js/admin/aside.js}"></script>
</body>
</html>
