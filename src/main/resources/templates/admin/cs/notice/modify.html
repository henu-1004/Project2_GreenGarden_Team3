<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>admin Cs Notice Modify</title>
    <!-- 날짜 : 2025/10/15
         이름 : 박효빈
         내용 : 관리자 고객센터 공지사항 수정 페이지
         -->
    <link rel="stylesheet" th:href="@{/css/admin/common/header.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/cs/admincsmain.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/common/footer.css}" />
</head>
<body>
<div th:replace="~{admin/common/header.html}"></div>
<main>
    <section class="content-wrap">
        <div th:replace="~{/admin/cs/aside :: aside}"></div>

        <!-- 메인 섹션: 공지사항 수정 -->
        <section id="main-section">
            <div class="top_nav">
                <h5>공지사항 수정</h5>
                <ul class="page_nation">
                    <li><a href="#">HOME</a></li>
                    <li><a href="#">고객센터</a></li>
                    <li><a href="#">공지사항</a></li>
                </ul>
            </div>

            <form class="admincs-write-form" th:action="@{/admin/cs/notice/modify}" th:object="${noticeDTO}" method="post">
                <!-- noticeId 값이 있을 때만 hidden input -->
                <input type="hidden" th:if="${noticeDTO != null}" th:field="*{noticeId}" />

                <!-- 1. 유형 -->
                <div class="admincs-view-row admincs-view-type">
                    <span class="admincs-view-label-text">유형</span>
                    <div class="admincs-write-input-wrap">
                        <select th:field="*{type}" class="admincs-input-select" required>
                            <option value="" disabled th:selected="${noticeDTO == null}">유형 선택</option>
                            <option value="고객서비스" th:selected="${noticeDTO.type == '고객서비스'}">고객서비스</option>
                            <option value="안전거래" th:selected="${noticeDTO.type == '안전거래'}">안전거래</option>
                            <option value="위해상품" th:selected="${noticeDTO.type == '위해상품'}">위해상품</option>
                            <option value="이벤트당첨" th:selected="${noticeDTO.type == '이벤트당첨'}">이벤트당첨</option>
                        </select>
                    </div>
                </div>

                <!-- 2. 제목 -->
                <div class="admincs-view-row admincs-view-title">
                    <span class="admincs-view-label-text">제목</span>
                    <div class="admincs-write-input-wrap">
                        <input type="text" th:field="*{title}" placeholder="제목을 입력합니다." class="admincs-input-text"/>
                    </div>
                </div>

                <!-- 3. 내용 -->
                <div class="admincs-view-content-area admincs-view-content-write">
                    <span class="admincs-view-label-text">내용</span>
                    <div class="admincs-write-input-wrap admincs-content-textarea-wrap">
                        <textarea th:field="*{content}" placeholder="내용을 입력합니다." class="admincs-input-textarea"></textarea>
                    </div>
                </div>

                <!-- 4. 버튼 그룹 -->
                <div class="admincs-write-actions">
                    <button type="button" class="btn-cancel" th:onclick="|location.href='@{/admin/cs/notice/list}'|">
                        <span>취소하기</span>
                    </button>
                    <button type="submit" class="btn-register">
                        <span>수정하기</span>
                    </button>
                </div>
            </form>
        </section>
    </section>
</main>
<div th:replace="~{/admin/common/footer :: footer}"></div>
</body>
</html>
