<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>admin Cs Notice list</title>
    <!-- 날짜 : 2025/10/02 이름 : 박효빈 내용 : 관리자 고객센터 LIST 페이지 -->
    <link rel="stylesheet" th:href="@{/css/admin/common/header.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/cs/admincsmain.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/common/footer.css}" />
</head>
<body>
<div th:replace="~{admin/common/header :: header}"></div>
<main>
    <section class="content-wrap">
        <div th:replace="~{admin/common/aside :: aside}"></div>

        <section id="main-section">
            <div class="top_nav">
                <h5>공지사항 목록</h5>
                <ul class="page_nation">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">마이페이지</a></li>
                    <li><a href="#">장바구니</a></li>
                </ul>
            </div>

            <!-- 검색/유형 선택 -->
            <form th:action="@{/admin/cs/notice/list}" method="get" class="search-form">
                <select name="type" th:value="${pageRequestDTO.type}" onchange="this.form.submit()">
                    <option value="">전체</option>
                    <option value="고객 서비스" th:selected="${pageRequestDTO.type == '고객 서비스'}">고객서비스</option>
                    <option value="안전 거래" th:selected="${pageRequestDTO.type == '안전 거래'}">안전거래</option>
                    <option value="위해 상품" th:selected="${pageRequestDTO.type == '위해 상품'}">위해상품</option>
                    <option value="이벤트 당첨" th:selected="${pageRequestDTO.type == '이벤트 당첨'}">이벤트당첨</option>
                </select>
            </form>

            <!-- 공지사항 목록 테이블 -->
            <table class="admincsnotice-table">
                <thead>
                <tr>
                    <th style="width: 30px;">
                        <input type="checkbox" id="selectAll" onclick="toggleAllCheckboxes(this)" />
                    </th>
                    <th>번호</th>
                    <th>유형</th>
                    <th>제목</th>
                    <th>조회</th>
                    <th>날짜</th>
                    <th style="width: 80px;">관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(pageResponseDTO.dtoList)}">
                    <td colspan="7" style="text-align: center">등록된 공지사항이 없습니다.</td>
                </tr>
                <tr th:each="notice : ${pageResponseDTO.dtoList}">
                    <td><input type="checkbox" name="admincscheck" th:value="${notice.noticeId}" /></td>
                    <td th:text="${notice.noticeId}">1</td>
                    <td th:text="${notice.type}">고양이서비스</td>
                    <td>
                        <a th:href="@{/admin/cs/notice/view(noticeId=${notice.noticeId})}"
                           th:text="${notice.title}"></a>
                    </td>
                    <td th:text="${notice.views}"></td>
                    <td th:text="${#temporals.format(notice.createdAt, 'yy.MM.dd')}"></td>
                    <td>
                        <button type="button"
                                th:onclick="|location.href='@{/admin/cs/notice/modify(noticeId=${notice.noticeId})}'|"
                                class="btn-modify">수정</button>
                        <button type="button" class="btn-delete"
                                th:onclick="deleteNotice('${notice.noticeId}')">삭제</button>                    </td>
                </tr>
                </tbody>
            </table>

            <!-- 페이지네이션 -->
            <div class="cs-pagination" th:if="${!pageResponseDTO.dtoList.isEmpty()}">
                <!-- 이전 버튼 -->
                <a th:href="@{/admin/cs/notice/list(pg=${pageResponseDTO.start - 1}, size=${pageRequestDTO.size}, type=${pageRequestDTO.type})}"
                   th:if="${pageResponseDTO.prev}" class="prev">&lt; 이전</a>
                <span th:unless="${pageResponseDTO.prev}" class="prev disabled">&lt; 이전</span>

                <!-- 페이지 번호 링크 -->
                <th:block th:each="pageNum : ${#numbers.sequence(pageResponseDTO.start, pageResponseDTO.end)}">
                    <a th:href="@{/admin/cs/notice/list(pg=${pageNum}, size=${pageRequestDTO.size}, type=${pageRequestDTO.type})}"
                       th:classappend="${pageNum == pageRequestDTO.pg ? 'active' : ''}"
                       th:text="${pageNum}">1</a>
                </th:block>

                <!-- 다음 버튼 -->
                <a th:href="@{/admin/cs/notice/list(pg=${pageResponseDTO.end + 1}, size=${pageRequestDTO.size}, type=${pageRequestDTO.type})}"
                   th:if="${pageResponseDTO.next}" class="next">다음 &gt;</a>
                <span th:unless="${pageResponseDTO.next}" class="next disabled">다음 &gt;</span>
            </div>

            <div class="action-buttons">
                <button type="button" onclick="deleteSelected()" class="btn-delete-all">전체삭제</button>
                <button type="button" class="btn-write"
                        th:onclick="|location.href='@{/admin/cs/notice/write}'|">작성하기</button>
            </div>
            <form id="deleteForm" th:action="@{/admin/cs/notice/deleteMultiple}" method="post">
                <input type="hidden" id="noticeIdsInput" name="noticeIds">
            </form>
        </section>
    </section>
</main>
<div th:replace="~{admin/common/footer :: footer}"></div>

<script>
    // 전체 선택/해제
    function toggleAllCheckboxes(source) {
        const checkboxes = document.getElementsByName('admincscheck');
        checkboxes.forEach(cb => cb.checked = source.checked);
    }

    // 전체삭제 클릭 시 체크된 항목 없으면 경고(JPA delete 연동 JS)
    function deleteSelected() {
        const checkedBoxes = [...document.getElementsByName('admincscheck')].filter(cb => cb.checked);
        if (checkedBoxes.length === 0) {
            alert('삭제할 항목을 선택해 주세요.');
            return;
        }
        if (confirm(`${checkedBoxes.length}개 항목을 삭제하시겠습니까?`)) {
            const ids = checkedBoxes.map(cb => cb.value);
            document.getElementById('noticeIdsInput').value = ids.join(',');
            document.getElementById('deleteForm').submit();
            alert('삭제처리 완료');
        }
    }
</script>
<script th:src="@{/js/admin/aside.js}"></script>
</body>
</html>
