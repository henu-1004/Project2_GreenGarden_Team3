<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOME > 관리자 환경설정 > 버전관리</title>
    <link rel="stylesheet" th:href="@{/css/admin/common/header.css}">
    <link rel="stylesheet" th:href="@{/css/admin/common/aside.css}">
    <link rel="stylesheet" th:href="@{/css/admin/config/version.css}">
    <link rel="stylesheet" th:href="@{/css/admin/common/footer.css}">
</head>
<!--
    날짜 : 2025/10/04
    이름 : 조지영
    내용 : HOME > 관리자 환경설정 > 버전관리
-->

<body>
<!-- 헤더 -->
<div th:replace="~{admin/common/header :: header}"></div>

<section class="content-wrap">
    <div th:replace="~{admin/config/aside :: aside}"></div>
    <main>
        <div id="main">
            <section id="main-section">
                <!-- 타이틀 & 경로 -->
                <div class="top_nav">
                    <h5>버전관리</h5>
                    <ul class="page_nation">
                        <li><a href="#">Home</a></li>
                        <li><a href="#">환경설정</a></li>
                        <li><a href="#">버전관리</a></li>
                    </ul>
                </div>

                <!-- (1) 버전정보 -->
                <div class="info-title">
                    <h2>버전 목록</h2>
                </div>
                <div class="info-box">
                    <strong>사이트 버전 목록입니다.</strong>
                </div>


                <!-- 버전정보 -->
                <div class="info-title"><h2>버전정보</h2></div>
                <table id="versionTable">
                    <thead>
                    <tr>
                        <th><input type="checkbox"></th>
                        <th>번호</th>
                        <th>버전</th>
                        <th>작성자</th>
                        <th>등록일시</th>
                        <th>변경내역</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- 행별 데이터는 data-*로 보유 -->
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>2</td>
                        <td>0.0.1-SNAPSHOT</td>
                        <td>yingbbang</td>
                        <td>2024.10.13 17:12:00</td>
                        <td>
                            <a href="#" class="js-open-view"
                               data-version="0.0.1-SNAPSHOT"
                               data-changes="- 프로젝트 생성 및 전체 구조 설계
- 회원가입 아이디 중복체크 완료
- 관리자 상품 등록 완료
- 쇼핑몰 메인 및 개별 페이지 링크 작업
- 개발을 위한 제반 사항 처리">[확인]</a>
                        </td>
                    </tr>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>1</td>
                        <td>0.0.1-SNAPSHOT</td>
                        <td>yingbbang</td>
                        <td>2024.10.13 17:12:00</td>
                        <td>
                            <a href="#" class="js-open-view"
                               data-version="0.0.1-SNAPSHOT"
                               data-changes="- 배포 스크립트 초안 추가
- 공통 헤더/푸터 CSS 리팩토링
- 카테고리 모듈 성능 개선">[확인]</a>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <!-- 하단 버튼 -->
                <div class="btn-wrap">
                    <button type="button" class="btn gray">선택삭제</button>
                    <button type="button" id="btnCreate" class="btn">&nbsp;&nbsp;&nbsp;&nbsp;등록&nbsp;&nbsp;&nbsp;&nbsp;
                    </button>
                </div>

                <!-- 페이징 -->
                <div class="pagination">
                    <a href="#">&laquo; 이전</a>
                    <a href="#" class="active">1</a>
                    <a href="#">2</a>
                    <a href="#">3</a>
                    <a href="#">4</a>
                    <a href="#">5</a>
                    <a href="#">다음 &raquo;</a>
                </div>
            </section>
        </div>
    </main>
</section>


<!-- 모달1: 확인 -->
<div id="modalView" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
        <div class="modal-header">
            <span>버전확인</span>
            <button class="modal-close js-close">X</button>
        </div>
        <div class="version-box">
            <table style="width:100%; border-collapse:collapse">
                <tr>
                    <th style="width:120px; background:#f7f8fa; border:1px solid #ccc; padding:8px">버전</th>
                    <td id="viewVersion" style="border:1px solid #ccc; padding:8px"></td>
                </tr>
                <tr>
                    <th style="background:#f7f8fa; border:1px solid #ccc; padding:8px">변경내역</th>
                    <td style="border:1px solid #ccc; padding:8px">
                        <div id="viewChanges" class="preline"></div>
                    </td>
                </tr>
            </table>
            <div style="text-align:center; margin-top:10px;">
                <a href="#" class="btn js-close">닫기</a>
            </div>
        </div>
    </div>
</div>

<!-- 모달2: 등록 -->
<div id="modalCreate" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
        <div class="modal-header">
            <span>버전등록</span>
            <button class="modal-close js-close">X</button>
        </div>
        <div class="version-box">
            <table style="width:100%; border-collapse:collapse">
                <tr>
                    <th style="width:120px; background:#f7f8fa; border:1px solid #ccc; padding:8px">버전</th>
                    <td style="border:1px solid #ccc; padding:8px">
                        <input id="createVersion" type="text" placeholder="그린가든" style="width:200px">
                    </td>
                </tr>
                <tr>
                    <th style="background:#f7f8fa; border:1px solid #ccc; padding:8px">변경내역</th>
                    <td style="border:1px solid #ccc; padding:8px">
                        <textarea id="createChanges" class="terms-box" placeholder="변경내역작성하기"></textarea>
                    </td>
                </tr>
            </table>
            <div style="text-align:center; margin-top:10px;">
                <a href="#" id="btnSubmit" class="btn">등록하기</a>
            </div>
        </div>
    </div>
</div>


<!-- 모달 본문 끝 -->

<div th:replace="~{admin/common/footer :: footer}"></div>
</body>
<script th:src="@{/js/admin/aside.js}"></script>
<script th:src="@{/js/admin/config/version.js}"></script>

<!-- 모달 스크립트 끝 -->
</html>
