<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOME > 관리자 환경설정 > 약관관리</title>
    <link rel="stylesheet" th:href="@{/css/admin/common/header.css}">
    <link rel="stylesheet" th:href="@{/css/admin/common/aside.css}">
    <link rel="stylesheet" th:href="@{/css/admin/config/policy.css}">
    <link rel="stylesheet" th:href="@{/css/admin/common/footer.css}">
</head>
<!--
    날짜 : 2025/10/04
    이름 : 조지영
    내용 : HOME > 관리자 환경설정 > 약관관리
-->
<body>
<div th:replace="~{admin/common/header :: header}"></div>
<section class="content-wrap">
    <div th:replace="~{admin/common/aside :: aside}"></div>
    <main>
        <div id="main">
            <section id="main-section">
                <div class="top_nav">
                    <!-- 페이지 타이틀 -->
                    <h5>약관관리</h5>
                    <ul class="page_nation">
                        <li><a th:href="@{/admin}">Home</a></li>
                        <li><a href="#">환경설정</a></li>
                        <li><a th:href="@{/admin/config/policy}">약관관리</a></li>
                    </ul>
                </div>


                <div class="info-title">
                    <h2>구매회원 약관</h2>
                </div>
                <div class="info-box">
                    <strong>회원가입 및 정책 페이지 노출약관 입니다.</strong>
                </div>

                <div class="version-box">
                    <table>
                        <tr>
                            <th><strong>사이트 버전</strong></th>
                            <td>
                                <div class="terms-box">
                                    <div class="terms-content view" id="view-BUYER" th:text="${buyerTerms}"></div>

                                    <form class="edit-form" id="form-BUYER"
                                          th:action="@{/admin/config/policy}" method="post" style="display: none;">
                                        <input type="hidden" name="type" value="BUYER">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <textarea name="content" class="edit-textarea" th:text="${buyerTerms}"></textarea>
                                        <div class="edit-actions" style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
                                            <button type="button" class="btn gray js-cancel" data-type="BUYER">취소</button>
                                            <button type="submit" class="btn">저장</button>
                                        </div>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="btn-wrap">
                    <button class="btn js-edit" data-type="BUYER">수정하기</button>
                </div>


                <div class="info-title">
                    <h2>판매회원 약관</h2>
                </div>
                <div class="info-box">
                    <strong>회원가입 및 정책 페이지 노출약관 입니다.</strong>
                </div>

                <div class="version-box">
                    <table>
                        <tr>
                            <th><strong>사이트 버전</strong></th>
                            <td>
                                <div class="terms-box">
                                    <div class="terms-content view" id="view-SELLER" th:text="${sellerTerms}"></div>

                                    <form class="edit-form" id="form-SELLER"
                                          th:action="@{/admin/config/policy}" method="post" style="display: none;">
                                        <input type="hidden" name="type" value="SELLER">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <textarea name="content" class="edit-textarea" th:text="${sellerTerms}"></textarea>
                                        <div class="edit-actions" style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
                                            <button type="button" class="btn gray js-cancel" data-type="SELLER">취소</button>
                                            <button type="submit" class="btn">저장</button>
                                        </div>
                                    </form>


                                </div>
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="btn-wrap">
                    <button class="btn js-edit" data-type="SELLER">수정하기</button>
                </div>


                <div class="info-title">
                    <h2>전자금융거래 약관</h2>
                </div>
                <div class="info-box">
                    <strong>회원가입 및 정책 페이지 노출약관 입니다.</strong>
                </div>

                <div class="version-box">
                    <table>
                        <tr>
                            <th><strong>사이트 버전</strong></th>
                            <td>
                                <div class="terms-box">
                                    <div class="terms-content view" id="view-FINANCE" th:text="${financeTerms}"></div>

                                    <form class="edit-form" id="form-FINANCE"
                                          th:action="@{/admin/config/policy}" method="post" style="display: none;">
                                        <input type="hidden" name="type" value="FINANCE">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <textarea name="content" class="edit-textarea" th:text="${financeTerms}"></textarea>
                                        <div class="edit-actions" style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
                                            <button type="button" class="btn gray js-cancel" data-type="FINANCE">취소</button>
                                            <button type="submit" class="btn">저장</button>
                                        </div>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="btn-wrap">
                    <button class="btn js-edit" data-type="FINANCE">수정하기</button>
                </div>


                <div class="info-title">
                    <h2>위치정보 이용약관</h2>
                </div>
                <div class="info-box">
                    <strong>회원가입 및 정책 페이지 노출약관 입니다.</strong>
                </div>

                <div class="version-box">
                    <table>
                        <tr>
                            <th><strong>사이트 버전</strong></th>
                            <td>
                                <div class="terms-box">
                                    <div class="terms-content view" id="view-LOCATION" th:text="${locationTerms}"></div>

                                    <form class="edit-form" id="form-LOCATION"
                                          th:action="@{/admin/config/policy}" method="post" style="display: none;">
                                        <input type="hidden" name="type" value="LOCATION">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <textarea name="content" class="edit-textarea" th:text="${locationTerms}"></textarea>
                                        <div class="edit-actions" style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
                                            <button type="button" class="btn gray js-cancel" data-type="LOCATION">취소</button>
                                            <button type="submit" class="btn">저장</button>
                                        </div>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="btn-wrap">
                    <button class="btn js-edit" data-type="LOCATION">수정하기</button>
                </div>


                <div class="info-title">
                    <h2>개인정보처리방침</h2>
                </div>
                <div class="info-box">
                    <strong>회원가입 및 정책 페이지 노출약관 입니다.</strong>
                </div>

                <div class="version-box">
                    <table>
                        <tr>
                            <th><strong>사이트 버전</strong></th>
                            <td>
                                <div class="terms-box">
                                    <div class="terms-content view" id="view-PRIVACY" th:text="${privacyTerms}"></div>

                                    <form class="edit-form" id="form-PRIVACY"
                                          th:action="@{/admin/config/policy}" method="post" style="display: none;">
                                        <input type="hidden" name="type" value="PRIVACY">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <textarea name="content" class="edit-textarea" th:text="${privacyTerms}"></textarea>
                                        <div class="edit-actions" style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
                                            <button type="button" class="btn gray js-cancel" data-type="PRIVACY">취소</button>
                                            <button type="submit" class="btn">저장</button>
                                        </div>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="btn-wrap">
                    <button class="btn js-edit" data-type="PRIVACY">수정하기</button>
                </div>

        </div>
    </main>
</section>
<div th:replace="~{admin/common/footer :: footer}"></div>
<script th:src="@{/js/admin/aside.js}"></script>
<script>
    document.querySelectorAll('.js-edit').forEach(btn => {
        btn.addEventListener('click', () => {
            const type = btn.dataset.type;
            document.getElementById('view-' + type).style.display = 'none';
            document.getElementById('form-' + type).style.display = 'block';
            document.getElementById('form-' + type).closest('.terms-box').classList.add('editing');
        });
    });

    document.querySelectorAll('.js-cancel').forEach(btn => {
        btn.addEventListener('click', () => {
            const type = btn.dataset.type;
            document.getElementById('form-' + type).style.display = 'none';
            document.getElementById('view-' + type).style.display = 'block';
            document.getElementById('form-' + type).closest('.terms-box').classList.remove('editing');
        });
    });
</script>
</body>
</html>
