<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin list</title>
    <!--
        날짜 : 2025/10/14
        이름 : 이수연
        내용 : 관리자 쿠폰발급현황 페이지
    -->
    <link rel="stylesheet" th:href="@{/css/admin/coupon/list.css}">

</head>
<body>
<div th:replace="~{admin/common/header :: header}"></div>
<main>
    <section class="content-wrap">
        <div th:replace="~{admin/common/aside :: aside}"></div>
        <section id="main-section">
            <div class="top-nav">
                <h3>쿠폰발급현황</h3>
                <ul class="page-nation">
                    <li><a th:href="@{/admin/}">Home</a></li>
                    <li><a href="#">쿠폰관리</a></li>
                    <li><a th:href="@{/admin/coupon/issued}">쿠폰발급현황</a></li>
                </ul>
            </div>
            <form th:action="@{#}" method="get" class="search-form">
                <select>
                    <option>발급번호</option>
                    <option>쿠폰번호</option>
                    <option>쿠폰명</option>
                    <option>사용자</option>
                </select>
                <input type="text" name="keyword" placeholder="세부 검색을 해보세요"/>
                <button type="submit">
                    <img th:src="@{/images/magnifier.png}" alt="돋보기" />
                </button>
            </form>
            <input type="hidden" id="csrfToken" th:value="${_csrf.token}">
            <input type="hidden" id="csrfHeader" th:value="${_csrf.headerName}">
            <table class="coupon-table">
                <tr>
                    <th>발급번호</th>
                    <th>쿠폰번호</th>
                    <th>쿠폰종류</th>
                    <th>쿠폰명</th>
                    <th>사용자</th>
                    <th>상태</th>
                    <th>사용일</th>
                    <th>관리</th>
                </tr>

                <tr th:each="row : ${issuedList}">
                    <td>
                        <span class="coupon-num-link"
                              onclick="openModal('modalIssueInfo')"
                              th:text="${row.issueId}"></span>
                    </td>
                    <td th:text="${row.couponNo}"></td>
                    <td th:text="${row.type}"></td>
                    <td th:text="${row.name}"></td>
                    <td th:text="${row.userId}"></td>
                    <td th:text="${row.viewStatus}" style="color: red"></td>
                    <td th:text="${#temporals.format(row.usedAt, 'yyyy-MM-dd HH:mm:SS')}"></td>
                    <td>
                        <form th:if="${row.canStop == 1}"
                              th:action="@{'/admin/coupon/issued/' + ${row.issueId} + '/stop'}"
                              method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit">중단</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(issuedList)}">
                    <td colspan="8" style="text-align: center; color: gray;">발급 내역이 없습니다.</td>
                </tr>
            </table>

            <section class="pagination">
                <!-- 이전 페이지 버튼 -->
                <a href="#" class="prev">&lt; 이전</a>

                <!-- 페이지 번호들 -->
                <a href="#" class="active">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">4</a>
                <a href="#">5</a>

                <!-- 다음 페이지 버튼 -->
                <a href="#" class="next">다음 &gt;</a>
            </section>
        </section>
    </section>
</main>
<div th:replace="~{admin/common/footer :: footer}"></div>
<div th:replace="~{admin/coupon/_issuedCouponInfo :: modal-coupon-issued}"></div>
<script th:src="@{/js/admin/aside.js}"></script>
<script th:src="@{/js/admin/coupon/couponModal.js}"></script>
<script th:src="@{/js/admin/coupon/issued.js}"></script>
</body>
</html>
