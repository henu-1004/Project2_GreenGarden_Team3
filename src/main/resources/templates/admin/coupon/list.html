<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin coupon list</title>
    <!--
        날짜 : 2025/09/28
        이름 : 이수연
        내용 : 관리자 쿠폰목록 페이지
    -->
    <link rel="stylesheet" th:href="@{/css/admin/coupon/list.css}">
    <link rel="stylesheet" th:href="@{/css/admin/coupon/_listCouponInsert.css}">
</head>
<body>
<div th:replace="~{admin/common/header :: header}"></div>
<main>
    <section class="content-wrap">
        <div th:replace="~{admin/common/aside :: aside}"></div>
        <section id="main-section">
            <div class="top-nav">
                <h3>쿠폰목록</h3>
                <ul class="page-nation">
                    <li><a th:href="@{/admin/}">Home</a></li>
                    <li><a href="#">쿠폰관리</a></li>
                    <li><a th:href="@{/admin/coupon/list}">쿠폰목록</a></li>
                </ul>
            </div>
            <form th:action="@{#}" method="get" class="search-form">
                <select>
                    <option>쿠폰번호</option>
                    <option>쿠폰명</option>
                    <option>발급자</option>
                </select>
                <input type="text" name="keyword" placeholder="세부 검색을 해보세요"/>
                <button type="submit">
                    <img th:src="@{/images/magnifier.png}" alt="돋보기" />
                </button>
            </form>
            <table class="coupon-table">
                <tr>
                    <th>쿠폰번호</th>
                    <th>쿠폰종류</th>
                    <th>쿠폰명</th>
                    <th>혜택</th>
                    <th style="width: 80px">사용기간</th>
                    <th>발급자</th>
                    <th>발급수</th>
                    <th>사용수</th>
                    <th>상태</th>
                    <th style="width: 80px">발급일</th>
                    <th>관리</th>
                </tr>
                <tr th:each="coupon, stat : ${couponList}">
                    <td><span class="coupon-num-link" onclick="openModal('modalCouponInfo')">[[${coupon.couponNo}]]</span></td>
                    <td>[[${coupon.type}]]</td>
                    <td>[[${coupon.name}]]</td>
                    <td>[[${coupon.benefit}]]</td>
                    <td>[[${coupon.startDate}]] ~ [[${coupon.endDate}]]</td>
                    <td>[[${coupon.issuer}]]</td>
                    <td>?</td>
                    <td>?</td>
                    <td style="color: green">?</td>
                    <td>[[${coupon.issuedAt}]]</td>
                    <td><input type="button" value="종료"></td>
                </tr>
            </table>
            <button type="button" class="btn-insert" onclick="openModal('modalCouponInsert')">등록하기</button>
            <section class="pagination">
                <!-- 이전 페이지 버튼 -->
                <a href="#" class="prev">&lt; 이전</a>

                <!-- 페이지 번호들 -->
                <a href="#" class="active">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">4</a>
                <a href="#">5</a>

                <!-- 다음 페이지 버튼 -->
                <a href="#" class="next">다음 &gt;</a>
            </section>
        </section>
    </section>
</main>
<div th:replace="~{admin/common/footer :: footer}"></div>
<div th:replace="~{admin/coupon/_listCouponInfo :: modal-ListCouponInfo}"></div>
<div th:replace="~{admin/coupon/_listCouponInsert :: modal-CouponInsert}"></div>
<script th:src="@{/js/admin/aside.js}"></script>
<script th:src="@{/js/admin/coupon/couponModal.js}"></script>
<script th:src="@{/js/admin/coupon/couponRegister.js}"></script>
</body>
</html>
