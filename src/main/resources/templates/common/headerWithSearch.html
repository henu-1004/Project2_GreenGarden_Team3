<header th:fragment="headerWithSearch">
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}" href="/css/product/list.css">
    <div id="header-wrap">
        <div id="header-top">
            <div class="header-util">
                <th:block th:if="${#authorization.expression('isAnonymous()')}">
                    <a th:href="@{/member/login}">로그인</a>
                    <a th:href="@{/member/join}">회원가입</a>
                </th:block>
                <th:block th:if="${#authorization.expression('isAuthenticated()')}">
                    <form th:action="@{/member/logout}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn-link">로그아웃</button>
                    </form>
                </th:block>
                <a th:href="@{/my/home}">마이페이지</a>
                <a th:href="@{/product/cart}">장바구니</a>
            </div>
        </div>
        <div id="header-middle">
            <a th:href="@{/}" class="logo">
                <img th:src="@{/images/LogoWidth.png}" alt="indexLogo" />
            </a>
            <form th:action="@{#}" method="get" class="search-form">
                <input type="text" name="keyword" placeholder="검색"/>
                <button type="submit">
                    <img th:src="@{/images/magnifier.png}" alt="돋보기" />
                </button>
            </form>
        </div>

    </div>
</header>
