<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 | 나의 리뷰</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">

    <!-- my 전용 CSS -->
    <link rel="stylesheet" th:href="@{/css/my/home.css}">
    <link rel="stylesheet" th:href="@{/css/my/review.css}">
    <link rel="stylesheet" th:href="@{/css/my/aside.css}">
</head>
<body>

<!-- 공통 헤더 -->
<div th:replace="~{common/headerNoSearch :: headerNoSearch}"></div>

<main class="mypage-container">
    <!-- 어사이드 -->
    <div th:replace="~{my/aside :: aside}"></div>

    <!-- 본문 -->
    <section class="content">
        <h1>나의 리뷰</h1>
        <p class="lead">작성한 리뷰를 관리하고, 추가 혜택을 챙겨보세요.</p>

        <!-- 리뷰 요약 -->
        <div class="review-summary">
            <div class="score-box">
                <span>평균 평점</span>
                <strong th:text="${reviewSummary == null ? '0.0' : reviewSummary.formattedAverageRating}">0.0</strong>
                <span th:text="'총 ' + (${reviewSummary == null ? 0 : reviewSummary.totalCount}) + '건'">총 0건</span>
            </div>
            <div class="detail-box">
                <dl>
                    <dt>작성한 리뷰</dt>
                    <dd th:text="(${reviewSummary == null ? 0 : reviewSummary.totalCount}) + '건'">0건</dd>
                    <dt>포토 리뷰</dt>
                    <dd th:text="(${reviewSummary == null ? 0 : reviewSummary.photoReviewCount}) + '건'">0건</dd>
                    <dt>답변 완료</dt>
                    <dd th:text="(${reviewSummary == null ? 0 : reviewSummary.answeredCount}) + '건'">0건</dd>
                </dl>
            </div>
        </div>

        <!-- 실제 데이터 -->
        <article class="review-item" th:each="review : ${reviewList}">
            <div class="item-header">
                <h3 th:text="${review.productName}">상품명</h3>
                <div class="rating" th:text="${review.ratingStars}">★★★★★</div>
            </div>
            <div class="item-meta">
                <span th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd')}">2025-09-22</span>
                · 주문번호 <span th:text="${review.orderNo}">20250922001</span>
            </div>
            <div class="item-body" th:text="${review.content}">
                리뷰 내용이 표시됩니다.
            </div>
        </article>

        <!-- 리뷰 없음 -->
        <div class="empty-state review-empty" th:if="${#lists.isEmpty(reviewList)}">
            아직 작성한 리뷰가 없습니다.
        </div>

        <div class="pagination" th:if="${reviewPage != null and reviewPage.totalPages > 1}">
            <a th:classappend="${!reviewPage.hasPrev}? ' disabled'"
               th:href="${reviewPage.hasPrev} ? @{/my/review(page=${reviewPage.prevPage})} : '#'"
               th:attr="aria-disabled=${!reviewPage.hasPrev}, tabindex=${!reviewPage.hasPrev}? -1 : null">이전</a>
            <a th:each="p : ${#numbers.sequence(reviewPage.startPage, reviewPage.endPage)}"
               th:classappend="${p == reviewPage.currentPage}? ' active'"
               th:href="@{/my/review(page=${p})}"
               th:text="${p}">1</a>
            <a th:classappend="${!reviewPage.hasNext}? ' disabled'"
               th:href="${reviewPage.hasNext} ? @{/my/review(page=${reviewPage.nextPage})} : '#'"
               th:attr="aria-disabled=${!reviewPage.hasNext}, tabindex=${!reviewPage.hasNext}? -1 : null">다음</a>
        </div>
    </section>
</main>

<!-- 공통 푸터 -->
<div th:replace="~{common/footer :: footer}"></div>

</body>
</html>
