<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="mypageBanner">
    <div class="banner-carousel" data-autoplay="true" data-interval="5000">
        <div class="banner-slides">
            <a class="banner-slide active" href="#" aria-label="그린가든 추천 기획전 배너">
                <img th:src="@{/images/배너광고1_810_86.png}" alt="Green Garden 기획전 배너">
            </a>
            <a class="banner-slide" href="#" aria-label="그린가든 회원 혜택 배너">
                <img th:src="@{/images/배너광고2_810_86.png}" alt="Green Garden 회원 전용 혜택 배너">
            </a>
        </div>
        <div class="banner-dots">
            <button type="button" class="active" data-index="0" aria-label="첫 번째 배너 보기">
                <span class="sr-only">첫 번째 배너 보기</span>
            </button>
            <button type="button" data-index="1" aria-label="두 번째 배너 보기">
                <span class="sr-only">두 번째 배너 보기</span>
            </button>
        </div>
    </div>
</th:block>
