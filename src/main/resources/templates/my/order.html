<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 | 주문 내역</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">

    <!-- my 전용 CSS -->
    <link rel="stylesheet" th:href="@{/css/my/home.css}">
    <link rel="stylesheet" th:href="@{/css/my/order.css}">
    <link rel="stylesheet" th:href="@{/css/my/aside.css}">
</head>
<body>

<!-- 공통 헤더 -->
<div th:replace="~{common/headerNoSearch :: headerNoSearch}"></div>

<main class="mypage-container">
    <!-- 어사이드 -->
    <div th:replace="~{my/aside :: aside}"></div>

    <!-- 본문 -->
    <section class="content">
        <h1>전체 주문 내역</h1>
        <p class="lead">최근 주문 현황과 배송 진행 상황을 한눈에 확인해 보세요.</p>

        <!-- 상단 배너 -->
        <div class="order-banner">
            <img th:src="@{/img/my/order_banner.png}" alt="주문 배너" width="810" height="86"
                 onerror="this.src='https://dummyimage.com/810x86/d9ede6/175a48.png&text=GreenGarden+MY+Order';">
        </div>

        <!-- 기간별 조회 -->
        <div class="order-filter">
            <form class="quick-range" th:action="@{/my/order}" method="get">
                <input type="hidden" name="page" value="1"/>
                <button type="submit" name="period" value="1w"
                        th:classappend="${selectedPeriod == '1w'} ? ' active'">1주일</button>
                <button type="submit" name="period" value="15d"
                        th:classappend="${selectedPeriod == '15d'} ? ' active'">15일</button>
                <button type="submit" name="period" value="1m"
                        th:classappend="${selectedPeriod == '1m'} ? ' active'">1개월</button>
            </form>

            <form class="custom-range" th:action="@{/my/order}" method="get">
                <input type="hidden" name="page" value="1"/>
                <label for="startDate">기간 직접 입력</label>
                <input type="date" id="startDate" name="startDate" th:value="${startDate}" required>
                <span>~</span>
                <input type="date" id="endDate" name="endDate" th:value="${endDate}" required>
                <button type="submit" class="btn-primary">조회</button>
            </form>
        </div>

        <div class="filter-caption">
            <span>총 <strong th:text="${totalCount}">0</strong>건의 주문이 조회되었습니다.</span>
            <span th:if="${limited}" class="limit-text">※ 조회 기간은 최대 5개월까지 가능합니다.</span>
        </div>

        <!-- 주문 내역이 없을 경우 -->
        <div class="empty-state" th:if="${orders == null or #lists.isEmpty(orders)}">
            주문내역이 없습니다.
        </div>

        <!-- 주문 내역 -->
        <div th:if="${orders != null and !#lists.isEmpty(orders)}">
            <table class="order-table">
                <thead>
                <tr>
                    <th>주문일자</th>
                    <th>주문번호</th>
                    <th>상품정보</th>
                    <th>수량</th>
                    <th>결제금액</th>
                    <th>주문상태</th>
                    <th>신청</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td data-label="주문일자" th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd')}">2023-01-01</td>
                    <td data-label="주문번호" class="order-number">
                        <span th:text="${order.orderNo}">O20230101001</span>
                    </td>
                    <td data-label="상품정보">
                        <div class="product-info">
                            <div class="thumb">
                                <img th:if="${order.productImg != null}" th:src="@{${order.productImg}}" alt="상품 이미지">
                                <img th:unless="${order.productImg != null}" th:src="@{/img/sample.png}" alt="상품 이미지">
                            </div>
                            <div class="details">
                                <p class="name" th:text="${order.productName}">상품명</p>
                            </div>
                        </div>
                    </td>
                    <td data-label="수량" th:text="${order.quantity}">1</td>
                    <td data-label="결제금액" th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'">0원</td>
                    <td data-label="주문상태" th:text="${order.status}">배송중</td>
                    <td data-label="신청">
                        <div class="order-actions">
                            <form th:if="${order.canConfirm}" th:action="@{/my/confirm}" method="post">
                                <input type="hidden" name="orderNo" th:value="${order.orderNo}">
                                <input type="hidden" name="proId" th:value="${order.proId}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn-primary">구매확정</button>
                            </form>
                            <form th:if="${order.canExchange}" th:action="@{/my/exchange/complete}" method="post">
                                <input type="hidden" name="orderNo" th:value="${order.orderNo}">
                                <input type="hidden" name="proId" th:value="${order.proId}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn-outline">교환신청</button>
                            </form>
                            <form th:if="${order.canReturn}" th:action="@{/my/return/complete}" method="post">
                                <input type="hidden" name="orderNo" th:value="${order.orderNo}">
                                <input type="hidden" name="proId" th:value="${order.proId}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn-outline">반품신청</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- 페이징 -->
            <div class="pagination" th:if="${pageInfo.totalPages > 1}">
                <a th:classappend="${!pageInfo.hasPrev}? ' disabled'"
                   th:href="@{/my/order(page=${pageInfo.prevPage}, period=${periodParam}, startDate=${selectedPeriod == 'custom' ? startDate : null}, endDate=${selectedPeriod == 'custom' ? endDate : null})}">이전</a>
                <a th:each="p : ${#numbers.sequence(pageInfo.startPage, pageInfo.endPage)}"
                   th:classappend="${p == pageInfo.currentPage}? ' active'"
                   th:href="@{/my/order(page=${p}, period=${periodParam}, startDate=${selectedPeriod == 'custom' ? startDate : null}, endDate=${selectedPeriod == 'custom' ? endDate : null})}"
                   th:text="${p}">1</a>
                <a th:classappend="${!pageInfo.hasNext}? ' disabled'"
                   th:href="@{/my/order(page=${pageInfo.nextPage}, period=${periodParam}, startDate=${selectedPeriod == 'custom' ? startDate : null}, endDate=${selectedPeriod == 'custom' ? endDate : null})}">다음</a>
            </div>
        </div>

        <!-- 안내 문구 -->
        <div class="notice-box" style="margin-top: 32px;">
            <i>ℹ️</i>
            <div>
                <strong>주문/배송 안내</strong>
                <p class="helper-text">
                    배송완료 후 7일 이내에 구매확정을 진행하시면 교환/반품 신청이 제한됩니다.
                </p>
            </div>
        </div>
    </section>
</main>

<!-- 공통 푸터 -->
<div th:replace="~{common/footer :: footer}"></div>

</body>
</html>
