<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 | 내 정보</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">

    <!-- my 전용 CSS -->
    <link rel="stylesheet" th:href="@{/css/my/home.css}">
    <link rel="stylesheet" th:href="@{/css/my/info.css}">
    <link rel="stylesheet" th:href="@{/css/my/aside.css}">
</head>
<body>

<!-- 공통 헤더 -->
<div th:replace="~{common/headerNoSearch :: headerNoSearch}"></div>

<main class="mypage-container">
    <!-- 어사이드 -->
    <div th:replace="~{my/aside :: aside}"></div>

    <!-- 본문 -->
    <section class="content">
        <div class="page-header">
            <div>
                <h1>내 정보 관리</h1>
                <p class="lead">회원 기본 정보와 배송지, 연락처를 최신 상태로 유지하세요.</p>
            </div>
            <div class="breadcrumbs">
                <span>마이페이지</span>
                <span>›</span>
                <span>내 정보</span>
            </div>
        </div>

        <div class="info-banner">
            <img th:src="@{/img/my/info_banner.png}" alt="내 정보 배너" width="810" height="86"
                 onerror="this.src='https://dummyimage.com/810x86/d9ede6/175a48.png&text=GreenGarden+MY+Info';">
        </div>

        <div class="alert success" th:if="${infoSuccessMessage != null}" th:text="${infoSuccessMessage}"></div>
        <div class="alert error" th:if="${infoErrorMessage != null}" th:text="${infoErrorMessage}"></div>

        <div class="profile-summary">
            <div class="avatar"
                 th:text="${info.name != null and !info.name.isBlank() ? info.name.substring(0,1) : (info.memId != null and info.memId.length() > 0 ? info.memId.substring(0,1) : 'GG')}">GG</div>
            <div class="summary-body">
                <h2 th:text="${info.name != null and !info.name.isBlank() ? info.name : (info.memId != null ? info.memId : '그린가든 회원')}">그린가든 회원</h2>
                <p th:text="${info.lastLogin != null ? '최근 로그인 ' + #temporals.format(info.lastLogin, 'yyyy.MM.dd') : '최근 로그인 기록이 없습니다.'}">최근 로그인 2025-10-12</p>
            </div>
            <div class="profile-meta">
                <dl>
                    <div class="row">
                        <dt>아이디</dt>
                        <dd th:text="${info.memId != null ? info.memId : '-'}">test01</dd>
                        <dt>가입일</dt>
                        <dd th:text="${info.joinDate != null ? #temporals.format(info.joinDate, 'yyyy.MM.dd') : '-'}">2025.01.01</dd>
                    </div>
                    <div class="row">
                        <dt>최근 로그인</dt>
                        <dd th:text="${info.lastLogin != null ? #temporals.format(info.lastLogin, 'yyyy.MM.dd') : '기록 없음'}">-</dd>
                        <dt>회원 상태</dt>
                        <dd th:text="${info.status != null ? info.status : '정상'}">정상</dd>
                    </div>
                    <div class="row full">
                        <dt>기본 배송지</dt>
                        <dd th:text="${info.addressBasic != null and !info.addressBasic.isBlank()
                            ? info.addressBasic + ' ' + (info.addressDetail != null ? info.addressDetail : '')
                            : '등록된 기본 배송지가 없습니다.'}">
                        </dd>


                    </div>
                </dl>
            </div>
        </div>

        <div class="info-stats">
            <div class="stat-card">
                <span>회원 등급</span>
                <strong th:text="${info.grade != null ? info.grade : '일반회원'}">일반회원</strong>
                <small th:text="${info.discountRate != null ? info.discountRate + '% 추가 할인' : '구매 실적에 따라 등급이 부여됩니다.'}">등급 안내</small>
            </div>
            <div class="stat-card">
                <span>보유 포인트</span>
                <strong th:text="${#numbers.formatInteger(info.totalPoint != null ? info.totalPoint : 0, 3, 'COMMA')} + 'P'">0P</strong>
                <small>적립 포인트는 주문 결제 시 사용할 수 있습니다.</small>
            </div>
            <div class="stat-card">
                <span>사용 가능 쿠폰</span>
                <strong th:text="${info.availableCouponCount != null ? info.availableCouponCount : 0} + '장'">0장</strong>
                <small>쿠폰함에서 상세 조건을 확인하세요.</small>
            </div>
            <div class="stat-card">
                <span>연락처</span>
                <strong th:text="${info.phone != null and !info.phone.isBlank() ? info.phone : '미등록'}">미등록</strong>
                <small th:text="${info.email != null and !info.email.isBlank() ? info.email : '이메일 미등록'}">-</small>
            </div>
        </div>

        <div class="info-form-card">
            <h3>내 정보 입력</h3>
            <form class="info-form" th:action="@{/my/info}" method="post" th:object="${infoForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-grid">
                    <div class="form-row">
                        <label for="name">이름</label>
                        <input type="text" id="name" name="name" th:value="*{name}" required>
                    </div>
                    <div class="form-row">
                        <label for="birth">생년월일</label>
                        <input type="date" id="birth" name="birth" th:value="*{birth}">
                    </div>
                    <div class="form-row">
                        <label>성별</label>
                        <div class="radio-group">
                            <label><input type="radio" name="gender" value="M" th:checked="*{gender} == 'M'"> 남성</label>
                            <label><input type="radio" name="gender" value="F" th:checked="*{gender} == 'F'"> 여성</label>
                            <label><input type="radio" name="gender" value="" th:checked="*{gender} == null or *{gender} == ''"> 미선택</label>
                        </div>
                    </div>
                    <div class="form-row">
                        <label for="email">이메일</label>
                        <input type="email" id="email" name="email" th:value="*{email}" placeholder="example@greengarden.com">
                    </div>
                    <div class="form-row">
                        <label for="phone">휴대폰</label>
                        <input type="text" id="phone" name="phone" th:value="*{phone}" placeholder="010-0000-0000">
                    </div>
                    <div class="form-row address-zip">
                        <label for="zipCode">우편번호</label>
                        <div class="zip-field">
                            <input type="text" id="zipCode" name="zipCode" th:value="*{zipCode}" readonly>
                            <button type="button" class="btn-outline" id="findAddressBtn">주소 찾기</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <label for="addressBasic">기본주소</label>
                        <input type="text" id="addressBasic" name="addressBasic" th:value="*{addressBasic}" placeholder="주소를 입력하세요">
                    </div>
                    <div class="form-row">
                        <label for="addressDetail">상세주소</label>
                        <input type="text" id="addressDetail" name="addressDetail" th:value="*{addressDetail}" placeholder="상세 주소를 입력하세요">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">수정하기</button>
                </div>
            </form>
        </div>
    </section>
</main>

<!-- 공통 푸터 -->
<div th:replace="~{common/footer :: footer}"></div>

<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script th:src="@{/js/my/info.js}"></script>

</body>
</html>
