<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product order</title>
    <!--
        날짜 : 2025/09/26
        이름 : 이수연
        내용 : 상품 주문 페이지
    -->
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}">
    <link rel="stylesheet" th:href="@{/css/common/aside.css}">
    <link rel="stylesheet" th:href="@{/css/product/order.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
</head>
<body>
<div th:replace="~{common/headerWithSearch :: headerWithSearch}"></div>
<main>
    <div class="content-wrap">
        <div th:replace="~{common/aside :: aside}"></div>
        <section id="main-section">
            <form th:action="@{/product/orderFix}" method="post">
                <div class="top-nav">
                    <h1>주문하기</h1>
                    <ul class="page-nation">
                        <li><a href="#">Home</a></li>
                        <li><a href="#">장바구니</a></li>
                        <li><a href="#">주문하기</a></li>
                    </ul>
                </div>
                <hr>
                <div class="main-container">
                    <div class="order-contain">
                        <h2>배송 정보</h2>
                        <div class="group">
                            <div class="form-group">
                                <label><span>수령자</span><input type="text" name="name"></label>
                            </div>
                            <div class="form-group">
                                <label><span>휴대폰</span><input type="text"></label>
                            </div>
                            <div class="form-group address">
                                <label><span>우편번호</span><input type="text"><button>검색</button></label>
                            </div>
                            <div class="form-group address">
                                <label><span>기본주소</span><input type="text"></label>
                            </div>
                            <div class="form-group address">
                                <label><span>상세주소</span><input type="text"></label>
                            </div>
                            <div class="form-group">
                                <label><span>배송메모</span><textarea> </textarea></label>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="order-contain">
                        <h2>주문 상품</h2>
                        <div class="table-area">
                            <table class="cart-table">
                                <thead>
                                <tr>
                                    <th class="col-item">상품명</th>
                                    <th class="col-count">수량</th>
                                    <th class="col-price">판매가</th>
                                    <th class="col-rate">할인</th>
                                    <th class="col-point">포인트</th>
                                    <th class="col-fee">배송비</th>
                                    <th class="col-sum">총합</th>
                                </tr>
                                </thead>
                                <tbody id="cart-items">
                                <tr>
                                    <td class="col-item-info">
                                        <div class="product-image">
                                            <img th:src="@{${product.img1}}"
                                                 alt="상품명"
                                                 onerror="this.src='https://placehold.co/150x150/e0e0e0/000000?text=Product+Image';">
                                        </div>
                                        <div class="product-info">
                                            <h6 th:text="${product.name}">상품명</h6>
                                            <p th:text="${product.description}">간단한 상품 설명</p>
                                        </div>
                                    </td>
                                    <td th:text="${quantity} + '개'">1개</td>
                                    <td th:text="${product.price} + '원'">30,000원</td>
                                    <td th:text="${product.discountRate} + '%'">10%</td>
                                    <td th:text="${product.point}">270</td>
                                    <td>무료배송</td>
                                    <td th:text="${product.price * (1 - product.discountRate / 100)} + '원'" style="color: red">29,500원</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <hr>
                    <div class="order-contain order-chek">
                        <div>
                            <div class="payment-discount">
                                <h2>할인정보</h2>
                                <div class="discount-group">
                                    <label>현재 포인트 : <span th:text="${product.point}">7200</span>점 <input type="number"></label>
                                    <p>포인트 5,000점 이상이면 현금처럼 사용가능</p>
                                    <label>쿠폰 적용 :
                                        <select>
                                            <option>쿠폰 발급 연결하기</option>
                                            <option>계좌 이체</option>
                                            <option>휴대폰 결제</option>
                                        </select>
                                    </label>
                                </div>
                            </div>
                            <div class="payment-options">
                                <h2>결제방법</h2>
                                <div class="options-details">
                                    <label><input type="radio" name="payment-method" value="신용카드"/>신용카드</label>
                                    <label><input type="radio" name="payment-method" value="체크카드"/>체크카드</label>
                                    <label><input type="radio" name="payment-method" value="계좌이체"/>계좌이체</label>
                                    <label><input type="radio" name="payment-method" value="무통장입금"/>무통장입금</label>
                                    <label><input type="radio" name="payment-method" value="휴대폰결제"/>휴대폰결제</label>
                                    <label><input type="radio" name="payment-method" value="삼성페이"/>삼성페이</label>
                                    <label><input type="radio" name="payment-method" value="카카오페이"/>카카오페이</label>
                                    <label><input type="radio" name="payment-method" value="네이버페이"/>네이버페이</label>
                                </div>
                            </div>
                        </div>
                        <div class="payment-summary">
                            <h2>최종결제정보</h2>
                            <div class="summary-details">
                                <div class="item">
                                    <span>상품수</span>
                                    <span id="product-count" th:text="${quantity}">1</span>
                                </div>
                                <div class="item">
                                    <span>상품금액</span>
                                    <span id="product-price" th:text="${product.price}">27,000</span>
                                </div>
                                <div class="item">
                                    <span>할인금액</span>
                                    <span id="discount-price" th:text="${product.discountRate}+'%'">-1,350</span>
                                </div>
                                <div class="item">
                                    <span>배송비</span>
                                    <span id="shipping-fee" th:text="${product.deliveryFee}">0</span>
                                </div>
                                <div class="item">
                                    <span>할인(쿠폰)</span>
                                    <span id="coupon-discount">-1,000</span>
                                </div>
                                <hr>
                                <div class="total-price">
                                    <span>전체주문금액</span>
                                    <span id="total-order-price"
                                          th:text="${#numbers.formatInteger(((product.price - (product.price * product.discountRate / 100)) * quantity) + product.deliveryFee, 0)}">
                                            24,650
                                        </span>
                                </div>
                                <div class="item">
                                    <span>적립 포인트</span>
                                    <span id="earned-points" th:text="${product.point}">270</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="order-contain order-agree">
                        <h2>주문 동의</h2>
                        <label><input type="checkbox">구매조건 확인 및 결제진행 동의합니다.</label>
                        <div class="btn-wrap">
                            <button type="button" class="btn btn-primary"
                                    th:onclick="|location.href='/greengarden/product/complete?orderNo=' + ${product.proId}|">
                                주문하기
                            </button>
                            <button type="button" class="btn btn-secondary"
                                    onclick="history.back()">
                                주문취소
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </div>
</main>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
