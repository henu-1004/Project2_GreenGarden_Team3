<div th:replace="~{cs/_csheader.html}"></div>
    <div class="main-container">
        <link rel="stylesheet" th:href="@{/css/cs/csmain.css}"/>
        <aside class="sidebar">
            <div class="cs-breadcrumb">
                <a href="#">홈</a>
                <span>></span>
                <a th:href="@{/cs/faq/list}" class="active-breadcrumb">자주묻는 질문</a>
            </div>
            <ul>
                <li class="menu">
                    <div class="menu-title">
                        <a th:href="@{/cs/faq/list}">자주묻는 질문</a>
                    </div>
                    <ul class="submenu open">
                        <li><a th:href="@{/cs/faq/list(type='회원')}" th:classappend="${pageRequestDTO.type == '회원' ? 'active' : ''}">회원</a></li>
                        <li><a th:href="@{/cs/faq/list(type='쿠폰/이벤트')}" th:classappend="${pageRequestDTO.type == '쿠폰/이벤트' ? 'active' : ''}">쿠폰/이벤트</a></li>
                        <li><a th:href="@{/cs/faq/list(type='주문/결제')}" th:classappend="${pageRequestDTO.type == '주문/결제' ? 'active' : ''}">주문/결제</a></li>
                        <li><a th:href="@{/cs/faq/list(type='배송')}" th:classappend="${pageRequestDTO.type == '배송' ? 'active' : ''}">배송</a></li>
                        <li><a th:href="@{/cs/faq/list(type='취소/반품/교환')}" th:classappend="${pageRequestDTO.type == '취소/반품/교환' ? 'active' : ''}">취소/반품/교환</a></li>
                        <li><a th:href="@{/cs/faq/list(type='여행/숙박/항공')}" th:classappend="${pageRequestDTO.type == '여행/숙박/항공' ? 'active' : ''}">여행/숙박/항공</a></li>
                        <li><a th:href="@{/cs/faq/list(type='안전거래')}" th:classappend="${pageRequestDTO.type == '안전거래' ? 'active' : ''}">안전거래</a></li>
                    </ul>
                </li>
            </ul>
        </aside>

        <section id="main-section">
            <h1 class="cs-main-title">자주묻는 질문</h1>

            <div class="cs-section">
                <div class="cs-content">
                    <div th:each="entry : ${faqMap}" class="faq-block">
                        <h3 th:text="${entry.key}">2차 분류 제목</h3>
                        <ul>
                            <li th:each="faq : ${entry.value}" class="faq-item">
                                <a th:href="@{/cs/faq/view(faqId=${faq.faqId})}" th:text="${faq.title}">FAQ 제목</a>
                            </li>

                        </ul>
                        <div class="more-btn" onclick="toggleMore(this)">더보기</div>
                    </div>


                    </div>
                </div>
        </section>
    </div>

<div th:replace="~{cs/_csfooter.html}"></div>
<script>
    // 페이지 로드 시, 모든 카테고리별로 3개 초과 항목을 숨기는 로직
    document.addEventListener('DOMContentLoaded', () => {
        const faqBlocks = document.querySelectorAll('.faq-block');

        faqBlocks.forEach(faqBlock => {
            const items = faqBlock.querySelectorAll('.faq-item');
            const moreBtn = faqBlock.querySelector('.more-btn');
            const initialLimit = 3; // 초기 표시 개수: 3개

            // 항목이 초기 제한 개수(3개)를 초과할 때만 숨김 처리
            if (items.length > initialLimit) {
                // 4번째 항목(index 3)부터 끝까지 숨김 처리
                for (let i = initialLimit; i < items.length; i++) {
                    items[i].style.display = 'none';
                }

                // 버튼에 현재 보이는 개수와 전체 개수를 저장
                moreBtn.dataset.visibleCount = initialLimit;
                moreBtn.dataset.totalCount = items.length;

                // 더보기 버튼을 활성화하고 텍스트를 설정
                const remaining = items.length - initialLimit;
                moreBtn.style.display = 'block';
                moreBtn.textContent = `더보기 (${remaining}개 더)`;
                moreBtn.classList.remove('expanded'); // 상태 초기화
            } else {
                // 항목이 3개 이하일 경우 버튼을 숨김
                moreBtn.style.display = 'none';
            }
        });
    });

    // 💡 2. 더보기/접기 버튼 클릭 이벤트 함수 (수정된 로직)
    function toggleMore(button) {
        const faqBlock = button.closest('.faq-block');
        const items = faqBlock.querySelectorAll('.faq-item');
        const totalCount = parseInt(button.dataset.totalCount);
        const initialLimit = 3; // 초기 표시 개수
        const step = 10; // 한번에 더 보여줄 개수 (10개)
        let visibleCount = parseInt(button.dataset.visibleCount);

        if (button.classList.contains('expanded')) {
            // [현재 '접기' 상태] -> '더보기'로 전환 (초기 3개만 보이기)

            // 4번째 항목부터 모두 숨김
            for (let i = initialLimit; i < totalCount; i++) {
                items[i].style.display = 'none';
            }

            button.classList.remove('expanded');
            button.dataset.visibleCount = initialLimit;
            button.textContent = `더보기 (${totalCount - initialLimit}개 더)`;

        } else {
            // [현재 '더보기' 상태] -> 다음 스텝 보여주기 또는 '접기'로 전환

            const nextCount = Math.min(visibleCount + step, totalCount);

            // 현재 보이는 항목 수(visibleCount)부터 다음 스텝까지 보여주기
            for (let i = visibleCount; i < nextCount; i++) {
                items[i].style.display = 'list-item';
            }

            button.dataset.visibleCount = nextCount;
            const remaining = totalCount - nextCount;

            if (remaining > 0) {
                // 아직 남은 항목이 있다면 '더보기' 버튼 유지
                button.textContent = `더보기 (${remaining}개 더)`;
            } else {
                // 모든 항목을 다 보여줬다면 '접기'로 전환
                button.classList.add('expanded');
                button.textContent = '접기';
            }
        }
    }
</script>
</body>
</html>
