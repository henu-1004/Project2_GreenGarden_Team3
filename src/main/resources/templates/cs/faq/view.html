<!--
  날짜 : 2025/09/29
  이름 : 박효빈
  내용 : 박효빈 고객센터 페이지 제작

<div th:replace="~{common/headerNoSearch :: header}"></div>
<div class="main-container">
    <link rel="stylesheet" th:href="@{/css/cs/csmain.css}"/>
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}"/>

    <aside class="sidebar">
        <div class="cs-breadcrumb">
            <a th:href="@{/cs/faq/list}">홈</a>
            <span>></span>
            <a th:href="@{/cs/faq/list}" class="active-breadcrumb" th:text="${faqDTO.category1}">자주묻는 질문</a>
        </div>

        <ul>
            <li class="menu open">
                <div class="menu-title">
                    <a th:href="@{/cs/faq/list}">자주묻는 질문</a>
                </div>
                <ul class="submenu">
                    <li th:classappend="${faqDTO.category1 == '회원' ? 'active' : ''}"><a th:href="@{/cs/faq/list(type='회원')}">회원</a></li>
                    <li th:classappend="${faqDTO.category1 == '쿠폰/이벤트' ? 'active' : ''}"><a th:href="@{/cs/faq/list(type='쿠폰/이벤트')}">쿠폰/이벤트</a></li>
                    <li th:classappend="${faqDTO.category1 == '주문/결제' ? 'active' : ''}"><a th:href="@{/cs/faq/list(type='주문/결제')}">주문/결제</a></li>
                    <li th:classappend="${faqDTO.category1 == '배송' ? 'active' : ''}"><a th:href="@{/cs/faq/list(type='배송')}">배송</a></li>
                    <li th:classappend="${faqDTO.category1 == '취소/반품/교환' ? 'active' : ''}"><a th:href="@{/cs/faq/list(type='취소/반품/교환')}">취소/반품/교환</a></li>
                    <li th:classappend="${faqDTO.category1 == '여행/숙박/항공' ? 'active' : ''}"><a th:href="@{/cs/faq/list(type='여행/숙박/항공')}">여행/숙박/항공</a></li>
                    <li th:classappend="${faqDTO.category1 == '안전거래' ? 'active' : ''}"><a th:href="@{/cs/faq/list(type='안전거래')}">안전거래</a></li>
                </ul>
            </li>
        </ul>
    </aside>

    <section id="main-section">

        <h1 class="cs-main-title">자주묻는 질문</h1>

        <div class="cs-section">

            <div class="cs-view-header">
                <div class="cs-view-category-title">
                    <span class="cs-view-category" th:text="${faqDTO.category2}">가입</span>
<!--                    <span class="cs-view-desc">관련 질문입니다.</span>-->
                </div>
            </div>

            <div class="cs-notice-view-box">
                <h3 class="cs-view-title" th:text="${faqDTO.title}">케이마켓 회원가입은 어떻게 하나요?</h3>
                <div class="cs-view-date" th:text="${#temporals.format(faqDTO.createdAt, 'yyyy.MM.dd')}">2022.11.30</div>
            </div>

            <div class="cs-content-box">
                <p th:utext="${faqDTO.content}">

                </p>
            </div>
        </div>

        <div class="cs-button-group">
            <a th:href="@{/cs/faq/list(type=${faqDTO.category1})}" class="cs-button">목록</a>
        </div>

    </section>
</div>
<div th:replace="~{common/footer :: footer}"></div>

</body>
</html>
