<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>문의하기 목록</title>
</head>
<body>
<div th:replace="~{common/headerNoSearch :: header}"></div>
<div class="main-container">
    <link rel="stylesheet" th:href="@{/css/cs/csmain.css}"/>
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}"/>

    <aside class="sidebar">
        <div class="cs-breadcrumb">
            <a th:href="@{/}">홈</a>
            <span>></span>
            <a th:href="@{/cs/qna/list}" class="active-breadcrumb">문의하기</a>
        </div>
        <ul>
            <li class="menu">
                <div class="menu-title">
                    <a th:href="@{/cs/qna/list}">문의하기</a>
                </div>
                <ul class="submenu open">
                    <li th:classappend="${pageRequestDTO.type == '회원' ? 'active' : ''}">
                        <a th:href="@{/cs/qna/list(type='회원')}">회원</a>
                    </li>
                    <li th:classappend="${pageRequestDTO.type == '쿠폰/이벤트' ? 'active' : ''}">
                        <a th:href="@{/cs/qna/list(type='쿠폰/이벤트')}">쿠폰/이벤트</a>
                    </li>
                    <li th:classappend="${pageRequestDTO.type == '주문/결제' ? 'active' : ''}">
                        <a th:href="@{/cs/qna/list(type='주문/결제')}">주문/결제</a>
                    </li>
                    <li th:classappend="${pageRequestDTO.type == '배송' ? 'active' : ''}">
                        <a th:href="@{/cs/qna/list(type='배송')}">배송</a>
                    </li>
                    <li th:classappend="${pageRequestDTO.type == '취소/반품/교환' ? 'active' : ''}">
                        <a th:href="@{/cs/qna/list(type='취소/반품/교환')}">취소/반품/교환</a>
                    </li>
                    <li th:classappend="${pageRequestDTO.type == '여행/숙박/항공' ? 'active' : ''}">
                        <a th:href="@{/cs/qna/list(type='여행/숙박/항공')}">여행/숙박/항공</a>
                    </li>
                    <li th:classappend="${pageRequestDTO.type == '안전거래' ? 'active' : ''}">
                        <a th:href="@{/cs/qna/list(type='안전거래')}">안전거래</a>
                    </li>
                </ul>
            </li>
        </ul>
    </aside>

    <section id="main-section">
        <h1 class="cs-main-title" th:text="${pageRequestDTO.type != null and pageRequestDTO.type != '' ? pageRequestDTO.type : '문의하기 전체'}">문의하기 전체</h1>

        <div class="cs-section">
            <div class="qna-write-btn-area">
                <a th:href="@{/cs/qna/write}" class="qna-write-btn">문의하기</a>
            </div>

            <div class="cs-content">
                <table class="qna-table">
                    <colgroup>
                        <col style="width: 10%;">
                        <col style="width: 40%;">
                        <col style="width: 15%;">
                        <col style="width: 15%;">
                        <col style="width: 20%;">
                    </colgroup>
                    <thead>
                    <tr>
                        <th>유형</th>
                        <th>제목</th>
                        <th>답변상태</th>
                        <th>작성자</th>
                        <th>날짜</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inquiry : ${responseDTO.dtoList}">
                        <td th:text="${inquiry.category2}">가입</td>
                        <td class="qna-title">
                            <a th:href="@{/cs/qna/view(inquiryId=${inquiry.inquiryId}, pg=${pageRequestDTO.pg}, size=${pageRequestDTO.size}, type=${pageRequestDTO.type}, searchType=${pageRequestDTO.searchType}, keyword=${pageRequestDTO.keyword})}"
                               th:text="${inquiry.title}">가입문의드립니다</a>
                        </td>
                        <td>
                            <span th:classappend="${inquiry.status == '완료' ? 'completed' : 'waiting'}"
                                  th:text="${inquiry.status}" class="qna-status">답변완료</span>
                        </td>

                        <td>
                            <th:block th:with="writerId=${inquiry.writer}">
                                <span th:if="${#strings.length(writerId) >= 3}">
                                    <span th:text="${#strings.substring(writerId, 0, 3)}">user</span>***
                                </span>
                                <span th:unless="${#strings.length(writerId) >= 3}" th:text="${writerId}">user</span>
                            </th:block>
                        </td>
                        <td th:text="${#temporals.format(inquiry.createdAt, 'yy.MM.dd')}">23.10.31</td>
                    </tr>
                    <tr th:if="${responseDTO.dtoList.isEmpty()}">
                        <td colspan="5" style="text-align: center;">등록된 문의 내역이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="cs-pagination" th:if="${!responseDTO.dtoList.isEmpty()}">
            <a th:href="@{/cs/qna/list(pg=${responseDTO.start - 1}, size=${pageRequestDTO.size}, type=${pageRequestDTO.type}, searchType=${pageRequestDTO.searchType}, keyword=${pageRequestDTO.keyword})}"
               th:if="${responseDTO.prev}" class="prev">&lt; 이전</a>
            <span th:unless="${responseDTO.prev}" class="prev disabled">&lt; 이전</span>

            <th:block th:each="pageNum : ${#numbers.sequence(responseDTO.start, responseDTO.end)}">
                <a th:href="@{/cs/qna/list(pg=${pageNum}, size=${pageRequestDTO.size}, type=${pageRequestDTO.type}, searchType=${pageRequestDTO.searchType}, keyword=${pageRequestDTO.keyword})}"
                   th:classappend="${pageNum == pageRequestDTO.pg ? 'active' : ''}"
                   th:text="${pageNum}">1</a>
            </th:block>

            <a th:href="@{/cs/qna/list(pg=${responseDTO.end + 1}, size=${pageRequestDTO.size}, type=${pageRequestDTO.type}, searchType=${pageRequestDTO.searchType}, keyword=${pageRequestDTO.keyword})}"
               th:if="${responseDTO.next}" class="next">다음 &gt;</a>
            <span th:unless="${responseDTO.next}" class="next disabled">다음 &gt;</span>
        </div>

        <div class="search-area">
            <form action="/cs/qna/list" method="get">
                <input type="hidden" name="type" th:value="${pageRequestDTO.type}">
                <select name="searchType" class="search-select">
                    <option value="all" th:selected="${pageRequestDTO.searchType == null or pageRequestDTO.searchType == 'all'}">전체</option>
                    <option value="T" th:selected="${pageRequestDTO.searchType == 'T'}">제목</option>
                    <option value="C" th:selected="${pageRequestDTO.searchType == 'C'}">내용</option>
                    <option value="W" th:selected="${pageRequestDTO.searchType == 'W'}">작성자</option>
                </select>
                <input type="text" name="keyword" th:value="${pageRequestDTO.keyword}" class="search-input" placeholder="검색어를 입력하세요">
                <button type="submit" class="search-button">검색</button>
            </form>
        </div>

    </section>
</div>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
