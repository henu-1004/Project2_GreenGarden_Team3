<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>문의 상세 보기</title>
    <link rel="stylesheet" th:href="@{/css/cs/csmain.css}"/>
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}"/>
</head>
<body>
<div th:replace="~{common/headerNoSearch :: header}"></div>
<div class="main-container">

    <aside class="sidebar">
        <div class="cs-breadcrumb">
            <a th:href="@{/}">홈</a>
            <span>></span>
            <a th:href="@{/cs/qna/list}" class="active-breadcrumb">문의하기</a>
        </div>

        <ul>
            <li class="menu open">
                <div class="menu-title">
                    <a th:href="@{/cs/qna/list}">문의하기</a>
                </div>
                <ul class="submenu">
                    <li th:classappend="${inquiryDTO.category1 == '회원'} ? 'active' : ''"><a th:href="@{/cs/qna/list(type='회원')}">회원</a></li>
                    <li th:classappend="${inquiryDTO.category1 == '쿠폰/이벤트'} ? 'active' : ''"><a th:href="@{/cs/qna/list(type='쿠폰/이벤트')}">쿠폰/이벤트</a></li>
                    <li th:classappend="${inquiryDTO.category1 == '주문/결제'} ? 'active' : ''"><a th:href="@{/cs/qna/list(type='주문/결제')}">주문/결제</a></li>
                    <li th:classappend="${inquiryDTO.category1 == '배송'} ? 'active' : ''"><a th:href="@{/cs/qna/list(type='배송')}">배송</a></li>
                    <li th:classappend="${inquiryDTO.category1 == '취소/반품/교환'} ? 'active' : ''"><a th:href="@{/cs/qna/list(type='취소/반품/교환')}">취소/반품/교환</a></li>
                    <li th:classappend="${inquiryDTO.category1 == '여행/숙박/항공'} ? 'active' : ''"><a th:href="@{/cs/qna/list(type='여행/숙박/항공')}">여행/숙박/항공</a></li>
                    <li th:classappend="${inquiryDTO.category1 == '안전거래'} ? 'active' : ''"><a th:href="@{/cs/qna/list(type='안전거래')}">안전거래</a></li>
                </ul>
            </li>
        </ul>
    </aside>

    <section id="main-section">
        <h1 class="cs-main-title">문의하기</h1>

        <div class="cs-section">
            <div class="qna-question-section">
                <div class="qna-question-header">
                    <span class="qna-badge question">질문</span>
                    <span class="qna-view-category" th:text="'[' + ${inquiryDTO.category1} + '] ' + ${inquiryDTO.title}">[가입] 가입문의드립니다</span>
                </div>

                <div class="qna-meta-info">
                    <th:block th:with="writerId=${inquiryDTO.writer}">
                        <span th:if="${#strings.length(writerId) >= 3}">
                            <span th:text="${#strings.substring(writerId, 0, 3)}">user</span>***
                        </span>
                        <span th:unless="${#strings.length(writerId) >= 3}" th:text="${writerId}">user</span>
                    </th:block>
                    <span> 님의 문의 내용입니다.</span>
                </div>
                <div class="qna-content-box">
                    <p th:utext="${#strings.replace(inquiryDTO.content, '\n', '<br>')}"></p>
                </div>
            </div>

            <div class="qna-answer-section" th:if="${inquiryDTO.status == '완료'}">
                <div class="qna-answer-header">
                    <span class="qna-badge answer">답변</span>
                    <span class="qna-answer-title">[답변] 문의에 대한 답변</span>
                </div>
                <div class="qna-answer-meta">
                    <span>답변 상태 : <span th:text="${inquiryDTO.status}"></span> | 작성자 : <span th:text="${inquiryDTO.writer}"></span></span>
                </div>
                <div class="qna-content-box">
                    <p th:utext="${#strings.replace(inquiryDTO.answer, '\n','<br>')}"></p>
                </div>
            </div>
            <div class="qna-answer-section" th:if="${inquiryDTO.status != '완료'}">
                <div class="qna-answer-header">
                    <span class="qna-badge answer">대기</span>
                    <span class="qna-answer-title">[답변] 대기 상태</span>
                </div>
                <div class="qna-answer-meta">
                    <span>답변 상태 : <span th:text="${inquiryDTO.status}"></span> | 작성자 : <span th:text="${inquiryDTO.writer}"></span></span>
                </div>
                <div class="qna-content-box">
                    <p>최대한 빠른 시간 내에 답변드리겠습니다. 잠시만 기다려주세요.</p>
                </div>
            </div>
        </div>

        <div class="cs-button-group">
            <a th:href="@{/cs/qna/list(pg=${pageRequestDTO.pg}, size=${pageRequestDTO.size}, type=${pageRequestDTO.type}, searchType=${pageRequestDTO.searchType}, keyword=${pageRequestDTO.keyword})}" class="cs-button">목록</a>
        </div>
    </section>
</div>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
