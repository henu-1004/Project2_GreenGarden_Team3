<div th:replace="~{common/headerNoSearch.html}"></div>
<div class="main-container">
    <link rel="stylesheet" th:href="@{/css/cs/csmain.css}"/>
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}"/>

    <aside class="sidebar">
        <div class="cs-breadcrumb">
            <a th:href="@{/}">홈</a>
            <span>></span>
            <a th:href="@{/cs/qna/write}" class="active-breadcrumb">문의하기</a>
        </div>

        <ul>
            <li class="menu open">
                <div class="menu-title">
                    <a th:href="@{/cs/qna/list}">문의하기</a>
                </div>
                <ul class="submenu">
                    <li><a th:href="@{/cs/qna/list(type='회원')}">회원</a></li>
                    <li><a th:href="@{/cs/qna/list(type='쿠폰/이벤트')}">쿠폰/이벤트</a></li>
                    <li><a th:href="@{/cs/qna/list(type='주문/결제')}">주문/결제</a></li>
                    <li><a th:href="@{/cs/qna/list(type='배송')}">배송</a></li>
                    <li><a th:href="@{/cs/qna/list(type='취소/반품/교환')}">취소/반품/교환</a></li>
                    <li><a th:href="@{/cs/qna/list(type='여행/숙박/항공')}">여행/숙박/항공</a></li>
                    <li><a th:href="@{/cs/qna/list(type='안전거래')}">안전거래</a></li>
                </ul>
            </li>
        </ul>
    </aside>

    <section id="main-section">
        <h1 class="cs-main-title">문의하기</h1>

        <div class="cs-section">
            <form class="qna-write-form" method="post" th:action="@{/cs/qna/write}">
                <!-- 문의유형 선택 -->
                <div class="qna-form-group">
                    <label class="qna-form-label">문의유형</label>
                    <div class="qna-form-input">
                        <div class="qna-select-group">
                            <select name="category1" class="qna-select" id="category1" onchange="updateCategory2()" required>
                                <option value="">1차 선택</option>
                                <option value="회원">회원</option>
                                <option value="쿠폰/이벤트">쿠폰/이벤트</option>
                                <option value="주문/결제">주문/결제</option>
                                <option value="배송">배송</option>
                                <option value="취소/반품/교환">취소/반품/교환</option>
                                <option value="여행/숙박/항공">여행/숙박/항공</option>
                                <option value="안전거래">안전거래</option>
                            </select>
                            <select name="category2" class="qna-select" id="category2" required>
                                <option value="">2차 선택</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 제목 -->
                <div class="qna-form-group">
                    <label class="qna-form-label">제목</label>
                    <div class="qna-form-input">
                        <input type="text" name="title" class="qna-input" placeholder="제목을 입력하세요" required>
                    </div>
                </div>

                <!-- 내용 -->
                <div class="qna-form-group">
                    <label class="qna-form-label">내용</label>
                    <div class="qna-form-input">
                        <textarea name="content" class="qna-textarea" placeholder="내용을 입력하세요" required></textarea>
                    </div>
                </div>

                <!-- 버튼 그룹 -->
                <div class="qna-button-group">
                    <button type="button" class="qna-cancel-btn" onclick="history.back()">취소하기</button>
                    <button type="submit" class="qna-submit-btn">등록하기</button>
                </div>
            </form>
        </div>
    </section>
</div>

<div th:replace="~{cs/_csfooter.html}"></div>

<script>
    const category2Options = {
        "회원": ["가입", "탈퇴", "회원정보"],
        "쿠폰/이벤트": ["쿠폰", "이벤트", "적립금"],
        "주문/결제": ["주문", "결제", "영수증"],
        "배송": ["배송조회", "배송지연", "배송지변경"],
        "취소/반품/교환": ["주문취소", "반품", "교환"],
        "여행/숙박/항공": ["여행", "숙박", "항공"],
        "안전거래": ["안전거래", "사기신고", "분쟁조정"]
    };

    function updateCategory2() {
        const category1 = document.getElementById('category1').value;
        const category2Select = document.getElementById('category2');
        category2Select.innerHTML = '<option value="">2차 선택</option>';
        if (category1 && category2Options[category1]) {
            category2Options[category1].forEach(option => {
                const opt = document.createElement('option');
                opt.value = option;
                opt.textContent = option;
                category2Select.appendChild(opt);
            });
        }
    }
</script>
