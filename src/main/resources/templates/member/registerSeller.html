<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>판매자 회원가입</title>
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
    <link rel="stylesheet" th:href="@{/css/member/registerSeller.css}">

</head>

<body>
<div th:replace="~{/common/headerNoSearch :: header}"></div>

<main class="registerSeller-wrap">
    <h2 class="registerSeller-title">판매자 회원가입</h2>

    <form th:action="@{/member/registerSeller}" method="post">

        <section class="section">
            <div class="form-grid">
                <label for="memId">아이디</label>
                <input id="memId" type="text" name="memId" placeholder="아이디 입력">
                <button type="button" class="subbtn" id="memIdBtn">아이디 중복</button>
                <span class="uidResult"></span>


                <label for="password">비밀번호</label>
                <div class="input-with-hint">
                <input id="password" type="password" name="password" placeholder="비밀번호 입력">
                <span class="muted">영문, 숫자, 특수문자 8~12자</span>
                </div>
                <span class="passResult"></span>

                <label for="password2">비밀번호 확인</label>
                <input id="password2" type="password" name="password2" placeholder="비밀번호 확인">
                <span></span>
            </div>
        </section>

        <section class="section">
            <div class="form-grid">
                <label for="company">회사명</label>
                <input id="company" type="text" name="company" placeholder="회사명입력 예) {주}상호명">
                <span></span>

                <label for="representative">대표</label>
                <input id="representative" type="text" name="representative" placeholder="이름입력">
                <span></span>

                <label for="tin">사업자등록번호</label>
                <input id="tin" type="text" name="tin" placeholder="사업자등록번호 입력">
                <span class="muted">-포함 12자리 입력</span>


                <label for="business_number">통신판매업번호</label>
                <input id="business_number" type="text" name="business_number" placeholder="통신판매업번호 입력">
                <span></span>

                <label for="tel">전화번호</label>
                <input id="tel" type="text" name="tel" placeholder="전화번호 입력">
                <span></span>

                <label for="fax">팩스</label>
                <input id="fax" type="text" name="fax" placeholder="팩스번호입력">
                <span></span>

                <label for="zip_code">주소</label>
                <input type="text" id="zip_code" name="zipCode" placeholder="우편번호" onclick="postcode()" readonly>
                <button type="button" class="subbtn" onclick="postcode()">우편번호 검색</button>
                <input type="text" id="address_basic" name="addressBasic" placeholder="기본주소" readonly>
                <input type="text" id="address_detail" name="addressDetail" placeholder="상세주소">
            </div>
        </section>

        <div class="actions">
            <button type="submit">회원가입</button>
        </div>
    </form>
</main>

<div th:replace="~{/common/footer :: footer}"></div>

<script th:src="@{/js/validation.js}"></script>

</body>

<script>
    const today = new Date();
    const formattedDate = today.toISOString().split('T')[0]; // "yyyy-MM-dd" 형식

    document.getElementById('joinDate').value = formattedDate;
</script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    function postcode() {
        new daum.Postcode({
            oncomplete: function (data) {
                // 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.

                // 각 주소의 노출 규칙에 따라 주소를 조합한다.
                // 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
                var addr = ''; // 주소 변수
                var extraAddr = ''; // 참고항목 변수

                //사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
                if (data.userSelectedType === 'R') { // 사용자가 도로명 주소를 선택했을 경우
                    addr = data.roadAddress;
                } else { // 사용자가 지번 주소를 선택했을 경우(J)
                    addr = data.jibunAddress;
                }

                // 사용자가 선택한 주소가 도로명 타입일때 참고항목을 조합한다.
                if (data.userSelectedType === 'R') {
                    // 법정동명이 있을 경우 추가한다. (법정리는 제외)
                    // 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
                    if (data.bname !== '' && /[동|로|가]$/g.test(data.bname)) {
                        extraAddr += data.bname;
                    }
                    // 건물명이 있고, 공동주택일 경우 추가한다.
                    if (data.buildingName !== '' && data.apartment === 'Y') {
                        extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                    }
                    // 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
                    if (extraAddr !== '') {
                        extraAddr = ' (' + extraAddr + ')';
                    }
                    // 조합된 참고항목을 해당 필드에 넣는다.
                    // document.getElementById("sample6_extraAddress").value = extraAddr;

                } else {
                    // document.getElementById("sample6_extraAddress").value = '';
                }

                // 우편번호와 주소 정보를 해당 필드에 넣는다.
                document.getElementById('zip_code').value = data.zonecode;
                document.getElementById("address_basic").value = addr;
                // 커서를 상세주소 필드로 이동한다.
                document.getElementById("address_detail").focus();
            }
        }).open();
    }
</script>

</html>
