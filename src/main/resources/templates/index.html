<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>메인 페이지 3조</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/common/header_index.css}">
    <link rel="stylesheet" th:href="@{/css/common/index_nav.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
</head>
<!--
    날짜 : 2025/09/23
    이름 : 한탁원
    내용 : Index 화면 구성
-->
<body>
<div th:replace="~{common/header_index :: header}"></div>
<main>
    <!-- ====== 상단 메인 슬라이드 ====== -->
    <div id="slide" class="banner-slider">
        <div class="slides">
            <img th:src="@{/images/가을배너광고1536_1024.png}" alt="가을 배너">
            <img th:src="@{/images/겨울배너광고1024_1024.png}" alt="겨울 배너">
            <img th:src="@{/images/배너광고1536_1024.png}" alt="기본 배너">
            <img th:src="@{/images/봄맞이배너광고1024_1024.png}" alt="봄 배너">
            <img th:src="@{/images/여름배너광고1536_1024.png}" alt="여름 배너">
        </div>

        <div class="dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <div th:replace="~{common/index_nav :: index_nav}"></div> <!-- 카테고리 네비 삽입 -->
    <div id="Ad-banner-top">
        상단 베너 광고
    </div>
    <div id="main">
        <div class="content-wrap">
            <section id="main-section">
                <div class="product">
                    <div id="best_title"><a>B E S T</a></div>
                    <div id="best_top">
                        <div class="best_top_product" th:each="i, iterStat : ${#numbers.sequence(1, 2)}">
                            <img th:src="@{/images/sample_thumb.png}" alt="상품">
                            <p>상품명</p>
                            <span><a>30,000원</a><a>10%</a></span><br>
                            <span><a>27,000원</a><button>무료배송</button></span>
                        </div>
                    </div>
                    <div id="best_bottom">
                        <div class="best_bottom_product" th:each="i, iterStat : ${#numbers.sequence(1, 3)}">
                            <img th:src="@{/images/sample_thumb.png}" alt="상품">
                            <p>상품명</p>
                            <span><a>30,000원</a><a>10%</a></span><br>
                            <span><a>27,000원</a><button>무료배송</button></span>
                        </div>
                    </div>
                </div>

                <div class="products right" title="HIT">
                    <div class="products_item" th:each="product : ${hitList}">
                        <img th:if="${product.img1}" th:src="@{${product.img1}}" alt="상품 이미지">
                        <p th:text="${product.name}">상품명</p>

                        <span>
                            <a th:text="${#numbers.formatInteger(product.price, 3, 'COMMA') + '원'}">30,000원</a>
                            <a th:text="${product.discountRate + '%'}">10%</a>
                        </span><br>

                        <span>
                            <a th:text="${#numbers.formatInteger(product.price * (1 - product.discountRate / 100.0), 3, 'COMMA') + '원'}">
                                27,000원
                            </a>
                            <button th:text="${product.deliveryFee == 0 ? '무료배송' : product.deliveryFee + '원'}">
                                무료배송
                            </button>
                        </span>
                    </div>
                </div>

                <div class="products left" title="NEW">
                    <div class="products_item" th:each="product : ${newList}">
                        <img th:if="${product.img1}" th:src="@{${product.img1}}" alt="상품 이미지">
                        <p th:text="${product.name}">상품명</p>

                        <span>
                            <a th:text="${#numbers.formatInteger(product.price, 3, 'COMMA') + '원'}">30,000원</a>
                            <a th:text="${product.discountRate + '%'}">10%</a>
                        </span><br>

                        <span>
                            <a th:text="${#numbers.formatInteger(product.price * (1 - product.discountRate / 100.0), 3, 'COMMA') + '원'}">
                                27,000원
                            </a>
                            <button th:text="${product.deliveryFee == 0 ? '무료배송' : product.deliveryFee + '원'}">
                                무료배송
                            </button>
                        </span>
                    </div>
                </div>

                <div class="products right" title="BRAND LEADER">
                    <div class="products_item" th:each="i, iterStat : ${#numbers.sequence(1, 8)}">
                        <img th:src="@{/images/sample_thumb.png}" alt="상품">
                        <p>상품명</p>
                        <span><a>30,000원</a><a>10%</a></span><br>
                        <span><a>27,000원</a><button>무료배송</button></span>
                    </div>
                </div>

                <div class="products left" title="SALE">
                    <div class="products_item" th:each="i, iterStat : ${#numbers.sequence(1, 8)}">
                        <img th:src="@{/images/sample_thumb.png}" alt="상품">
                        <p>상품명</p>
                        <span><a>30,000원</a><a>10%</a></span><br>
                        <span><a>27,000원</a><button>무료배송</button></span>
                    </div>
                </div>

                <div th:replace="~{common/footer :: footer}"></div>
            </section>
        </div>
    </div>
</main>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const slides = document.querySelectorAll("#slide .slides img");
        const dots = document.querySelectorAll("#slide .dot");
        let index = 0;

        function showSlide(n) {
            slides.forEach((slide, i) => {
                slide.classList.toggle("active", i === n);
                dots[i].classList.toggle("active", i === n);
            });
        }

        function nextSlide() {
            index = (index + 1) % slides.length;
            showSlide(index);
        }

        // 초기 표시
        showSlide(index);

        // 4초마다 전환
        setInterval(nextSlide, 4000);

        // 점 클릭 시 해당 슬라이드로 이동
        dots.forEach((dot, i) => {
            dot.addEventListener("click", () => {
                index = i;
                showSlide(index);
            });
        });
    });
</script>

</body>
</html>
