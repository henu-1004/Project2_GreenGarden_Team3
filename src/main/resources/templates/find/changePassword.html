<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}">
    <link rel="stylesheet" th:href="@{/css/find/changePassword.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
    <!--
       날짜 : 2025/09/30
       이름 : 이종봉
       내용 : 경로 수정.
   -->
</head>

<body>
<div th:replace="~{common/headerNoSearch :: headerNoSearch}"></div>

<main class="pw-wrap">
    <h2 class="pw-title">비밀번호 변경</h2>

    <form id="pwChangeForm" th:action="@{/find/changePassword}" method="post" class="section">
        <div class="pw-grid">
            <div class="label">아이디</div>
            <div class="readonly" th:text="${session.pwTargetId}"></div>
            <span></span>

            <div class="row-divider"></div>

            <label class="label" for="newPw">새 비밀번호</label>
            <input id="newPw" type="password" name="newPassword" placeholder="새 비밀번호 입력">
            <div class="muted" id="pwRuleMsg">영문, 숫자, 특수분자를 조합해 8자 이상</div>

            <div class="row-divider"></div>

            <label class="label" for="newPw2">새 비밀번호 확인</label>
            <input id="newPw2" type="password" name="confirmPassword" placeholder="새 비밀번호 확인 입력">
            <div class="muted" id="pwMatchMsg">동일하게 한번 더 입력하세요</div>
        </div>


        <p class="helper">
            비밀번호를 변경해 주세요. 영문, 숫자, 특수문자를 사용하여 8자 이상 입력해 주세요.
        </p>


        <div class="actions right">
            <a th:href="@{/member/login}">
                <button type="button" class="btn btn-ghost">취소</button>
            </a>

                <button type="submit" class="btn btn-primary" id="btnChange" disabled>다음</button>

        </div>
    </form>
</main>

<div th:replace="~{common/footer :: footer}"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const newPw = document.getElementById('newPw');
    const newPw2 = document.getElementById('newPw2');
    const btn = document.getElementById('btnChange');
    const ruleMsg = document.getElementById('pwRuleMsg');
    const matchMsg = document.getElementById('pwMatchMsg');

    const strong = (s) => !!s
        && s.length >= 8
        && /[A-Za-z]/.test(s)
        && /\d/.test(s)
        && /[^A-Za-z0-9]/.test(s);

    function validate(){
        const a = newPw.value, b = newPw2.value;

        if(!a){
            ruleMsg.textContent = '영문, 숫자, 특수문자를 조합해 8자 이상 입력해주세요';
            ruleMsg.style.color = '#777';
        }else if(strong(a)){
            ruleMsg.textContent = '사용 가능한 비밀번호입니다.';
            ruleMsg.style.color = 'green';
        }else{
            ruleMsg.textContent = '영문, 숫자, 특수문자를 조합해 8자 이상 입력해주세요';
            ruleMsg.style.color = 'red';
        }

        if(!b){
            matchMsg.textContent = '동일하게 한 번 더 입력하세요';
            matchMsg.style.color = '#777';
        }else if (a === b){
            matchMsg.textContent = '비밀번호가 일치합니다.';
            matchMsg.style.color = 'green';
        }else {
            matchMsg.textContent = '비밀번호가 일치하지 않습니다.';
            matchMsg.style.color = 'red';
        }

        btn.disabled = !(strong(a) && a === b);

    }

    newPw.addEventListener('input', validate);
    newPw2.addEventListener('input', validate);
});

</script>



</body>
</html>
