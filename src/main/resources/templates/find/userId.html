<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>아이디 찾기</title>
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}">
    <link rel="stylesheet" th:href="@{/css/find/userId.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">

    <!--
       날짜 : 2025/09/30
       이름 : 이종봉
       내용 : 경로 수정.
   -->
</head>

<body>
<div th:replace="~{/common/headerNoSearch :: headerNoSearch}"></div>

<main class="find-wrap is-email">
    <h2 class="find-title">아이디 찾기</h2>

    <section class="section">
        <div class="fid-tabs">
            <button type="button" class="find-tab active">이메일 인증</button>
            <button type="button" class="find-tab">휴대폰 인증</button>
        </div>

        <form th:action="@{/find/userId/result}" method="post" class="email-fields">
            <div class="form-grid">
                <div class="row-divider"></div>

                <label for="fi-name">이름</label>
                <input id="fi-name" type="text" name="name" placeholder="이름 입력">
                <span></span>

                <div class="row-divider"></div>

                <label for="fi-email">이메일</label>
                <input id="fi-email" type="text" name="email" placeholder="이메일 입력">
                <button type="button" class="subbtn">인증번호 받기</button>

                <span></span>
                <input id="fi-code" type="text" name="code" placeholder="인증번호 입력">
                <button type="button" class="subbtn">확인</button>
            </div>
        </form>

        <!-- 휴대폰 인증-->
        <form class="phone-fields">
            <div class="form-grid">
                <div class="row-divider"></div>

                <label for="fp-name">이름</label>
                <input id="fp-phone" type="text" placeholder="휴대폰 번호 입력">
                <button type="button" class="subbtn">인증번호 받기</button>

                <span></span>
                <input id="fp-code" type="text" placeholder="인증번호 입력">
                <button type="button" class="subbtn">확인</button>
            </div>
        </form>
    </section>

    <p class="help">
        회원가입 시 이메일 주소와 입력한 이메일 주소가 같아야 인증번호를 받을 수 있습니다.<br>
        인증번호를 입력한 뒤 <strong>확인</strong> 버튼을 누르세요.
    </p>

    <div class="actions right">
        <a th:href="@{/member/login}">
            <button type="button" class="btn btn-ghost">취소</button>
        </a>
        <a th:href="@{/find/resultId}">
            <button type="button" class="btn btn-primary">다음</button>
        </a>
    </div>
</main>

<div th:replace="~{/common/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function(){

        const emailBtns = document.getElementsByClassName('subbtn');
        const btnSend = emailBtns[0];
        const btnCheck = emailBtns[1];
        const btnNext = document.getElementsByClassName('btn-primary')[0];

        const inputName = document.getElementById('fi-name');
        const inputEmail = document.getElementById('fi-email');
        const inputCode = document.getElementById('fi-code');

        let verified = false;

        // 인증번호
        btnSend.addEventListener('click', async function(){
            const email = inputEmail.value.trim();
            if(email === ""){
                alert('이메일을 입력하세요.');
                return;
            }

            await fetch('/find/userId/sendCode', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'email=' + encodeURIComponent(email)
            });

            alert('인증번호가 전송되었습니다.');
        });

        // 인증번호 확인
        btnCheck.addEventListener('click', async function(){
            const email = inputEmail.value.trim();
            const code = inputCode.value.trim();

            if(code === ""){
                alert('인증번호를 입력하세요.');
                return;
            }

            const res = await fetch('/find/userId/verifyCode', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'email=' + encodeURIComponent(email) + '&code=' + encodeURIComponent(code)
            });

            const ok = await res.json();
            if(ok){
                alert('인증 성공!');
                verified = true;
                btnNext.disabled = false;
                btnNext.classList.add('active');
            }else{
                alert('인증번호가 올바르지 않습니다.');
            }
        });

        // 다음 버튼
        btnNext.addEventListener('click', function (){
            if(!verified){
                alert('인증을 먼저 완료해주세요.');
                return;
            }

            const form = document.createElement('form');
            form.method = 'post';
            form.action = '/find/userId/result';

            const nameField = document.createElement('input');
            nameField.name = 'name';
            nameField.value = inputName.value;

            const emailField = document.createElement('input');
            emailField.name = 'email';
            emailField.value = inputEmail.value;

            form.appendChild(nameField);
            form.appendChild(emailField);
            document.body.appendChild(form);
            form.submit();
        });

    });
</script>

</body>
</html>
