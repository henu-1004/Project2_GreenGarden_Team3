<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>아이디 찾기</title>
    <link rel="stylesheet" th:href="@{/css/common/headerWithSearch.css}">
    <link rel="stylesheet" th:href="@{/css/find/userId.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">

    <!--
       날짜 : 2025/09/30
       이름 : 이종봉
       내용 : 경로 수정.
   -->
</head>

<body>
<div th:replace="~{common/headerNoSearch :: headerNoSearch}"></div>

<main class="find-wrap is-email">
    <h2 class="find-title">아이디 찾기</h2>

    <section class="section">
        <div class="fid-tabs">
            <button type="button" class="find-tab active">이메일 인증</button>
            <button type="button" class="find-tab">휴대폰 인증</button>
        </div>

        <form th:action="@{/find/userId/result}" method="post" class="email-fields">
            <div class="form-grid">
                <div class="row-divider"></div>

                <label for="fi-name">이름</label>
                <input id="fi-name" type="text" name="name" placeholder="이름 입력">
                <span></span>

                <div class="row-divider"></div>

                <label for="fi-email">이메일</label>
                <input id="fi-email" type="text" name="email" placeholder="이메일 입력">
                <button id="btnSend" type="button" class="subbtn">인증번호 받기</button>
                <span id="emailResult" class="feedback"></span>

                <label for="fi-code">인증코드</label>
                <input id="fi-code" type="text" name="code" placeholder="인증번호 입력">
                <button id="btnCheck" type="button" class="subbtn">확인</button>
                <span id="codeResult" class="feedback"></span>
            </div>
        </form>

        <!-- 휴대폰 인증-->
        <form class="phone-fields">
            <div class="form-grid">
                <div class="row-divider"></div>

                <label for="fp-name">이름</label>
                <input id="fp-phone" type="text" placeholder="휴대폰 번호 입력">
                <button type="button" class="subbtn">인증번호 받기</button>

                <span></span>
                <input id="fp-code" type="text" placeholder="인증번호 입력">
                <button type="button" class="subbtn">확인</button>
            </div>
        </form>
    </section>

    <p class="help">
        회원가입 시 이메일 주소와 입력한 이메일 주소가 같아야 인증번호를 받을 수 있습니다.<br>
        인증번호를 입력한 뒤 <strong>확인</strong> 버튼을 누르세요.
    </p>

    <div class="actions right">
        <a th:href="@{/member/login}">
            <button type="button" class="btn btn-ghost">취소</button>
        </a>

        <button type="button" class="btn btn-primary" id="btnNext" disabled>다음</button>
    </div>
</main>

<div th:replace="~{common/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const inputEmail = document.getElementById('fi-email');
        const inputCode  = document.getElementById('fi-code');
        const btnSend    = document.getElementById('btnSend');
        const btnCheck   = document.getElementById('btnCheck');
        const emailMsg   = document.getElementById('emailResult');
        const codeMsg    = document.getElementById('codeResult');

        const btnNext = document.getElementById('btnNext');
        const POST_URL   = '/greengarden/find/userId/result';

        let sending = false, verifying = false, verified = false;

        const setMsg = (el, text, color) => {
            el.textContent = (text || '').trim();   // ''면 CSS :empty 로 숨김
            if (el.textContent) el.style.color = color || '#2d6f54';
        };

        // 인증번호 전송
        btnSend.addEventListener('click', async () => {
            if (sending) return;
            const email = inputEmail.value.trim();
            if (!email) {
                setMsg(emailMsg, '이메일을 입력하세요.', 'red');
                return;
            }

            try {
                sending = true; btnSend.disabled = true;
                setMsg(emailMsg, '인증번호 전송 중입니다…');
                await fetch('/greengarden/find/userId/sendCode', {
                    method:'POST',
                    headers:{'Content-Type':'application/x-www-form-urlencoded'},
                    body:'email='+encodeURIComponent(email)
                });
                setMsg(emailMsg, '인증번호를 전송했습니다.', 'green');
            } catch(e) {
                setMsg(emailMsg, '전송 실패. 잠시 후 다시 시도하세요.', 'red');
            } finally {
                sending = false; btnSend.disabled = false;
            }
        });

        // 인증번호 확인
        btnCheck.addEventListener('click', async () => {
            if (verifying) return;
            const email = inputEmail.value.trim();
            const code  = inputCode.value.trim();
            if (!code) {
                setMsg(codeMsg, '인증번호를 입력하세요.', 'red');
                return;
            }

            try {
                verifying = true; btnCheck.disabled = true;
                setMsg(codeMsg, '확인 중입니다…');
                const res = await fetch('/greengarden/find/userId/verifyCode', {
                    method:'POST',
                    headers:{'Content-Type':'application/x-www-form-urlencoded'},
                    body:'email='+encodeURIComponent(email)+'&code='+encodeURIComponent(code)
                });
                const ok = await res.json();
                if (ok) {
                    setMsg(emailMsg, '이메일이 인증되었습니다.', 'green');
                    setMsg(codeMsg,  '인증이 완료되었습니다.', 'green');
                    verified = true;
                    btnNext.disabled = false;
                    inputEmail.readOnly = true; inputCode.readOnly = true;
                    btnSend.disabled = true; btnCheck.disabled = true; btnCheck.textContent = '인증 완료';
                } else {
                    setMsg(codeMsg, '인증코드가 올바르지 않습니다.', 'red');
                    btnCheck.disabled = false;
                }
            } catch(e) {
                setMsg(codeMsg, '검증 실패. 다시 시도하세요.', 'red');
                btnCheck.disabled = false;
            } finally {
                verifying = false;
            }
        });

        // 다음 버튼
        btnNext.addEventListener('click', (e) => {
            e.preventDefault();
            if (!verified) {
                setMsg(codeMsg, '이메일 인증을 먼저 완료하세요.', 'red');
                return;
            }

            const form = document.createElement('form');
            form.method = 'post';
            form.action = POST_URL;

            const fName  = document.createElement('input');
            fName.type = 'hidden'; fName.name = 'name';
            fName.value = document.getElementById('fi-name').value.trim();

            const fEmail = document.createElement('input');
            fEmail.type = 'hidden'; fEmail.name = 'email';
            fEmail.value = inputEmail.value.trim();

            form.appendChild(fName);
            form.appendChild(fEmail);
            document.body.appendChild(form);
            form.submit();
        });


    });
</script>


</body>
</html>
